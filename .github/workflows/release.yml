name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
      - name: Build agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          artifact=l4d2panel-agent-${{ matrix.suffix }}
          go build -trimpath \
            -ldflags="-s -w -X github.com/l4d2-panel/l4d2panel/internal/version.Version=${GITHUB_REF_NAME} -X github.com/l4d2-panel/l4d2panel/internal/version.Commit=${GITHUB_SHA} -X github.com/l4d2-panel/l4d2panel/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$artifact" ./cmd/agent
          sha256sum "$artifact" >"$artifact.sha256"
          cp configs/agent.portable.example.yaml agent.yaml.example
      - uses: actions/upload-artifact@v4
        with:
          name: l4d2panel-agent-${{ matrix.suffix }}
          path: |
            l4d2panel-agent-${{ matrix.suffix }}
            l4d2panel-agent-${{ matrix.suffix }}.sha256
            agent.yaml.example
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            l4d2panel-agent-${{ matrix.suffix }}
            l4d2panel-agent-${{ matrix.suffix }}.sha256
      - name: Attach portable Agent config example
        if: startsWith(github.ref, 'refs/tags/') && matrix.goos == 'linux'
        uses: softprops/action-gh-release@v2
        with:
          files: agent.yaml.example

  windows-center:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Import optional code-signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Output 'Unsigned build requested.'; exit 0 }
          [IO.File]::WriteAllBytes('signing.pfx', [Convert]::FromBase64String($env:PFX_BASE64))
          $certificate = Import-PfxCertificate -FilePath signing.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          "WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build portable ZIP, SBOM, notices, and hashes
        shell: pwsh
        env:
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') { $version = '0.1.0-ci.${{ github.run_number }}' }
          ./packaging/windows/Build-WindowsPortable.ps1 `
            -Version $version
      - name: Validate portable package structure
        shell: pwsh
        run: |
          $package = Get-ChildItem dist/windows-center -Filter *.zip | Select-Object -First 1
          if (-not $package) { throw 'Portable ZIP was not produced.' }
          ./packaging/windows/Test-WindowsPortablePackage.ps1 -PackagePath $package.FullName
      - name: Elevated portable install and upgrade smoke test
        shell: pwsh
        run: |
          $package = Get-ChildItem dist/windows-center -Filter *.zip | Select-Object -First 1
          ./packaging/windows/Test-WindowsPortableInstall.ps1 -PackagePath $package.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: l4d2panel-center-windows-x64
          path: |
            dist/windows-center/*.zip
            dist/windows-center/*.sha256
      - name: Attach center portable ZIP to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-center/*.zip
            dist/windows-center/*.sha256
