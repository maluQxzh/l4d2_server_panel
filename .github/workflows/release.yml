name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
      - name: Build agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          artifact=l4d2panel-agent-${{ matrix.suffix }}
          go build -trimpath \
            -ldflags="-s -w -X github.com/l4d2-panel/l4d2panel/internal/version.Version=${GITHUB_REF_NAME} -X github.com/l4d2-panel/l4d2panel/internal/version.Commit=${GITHUB_SHA} -X github.com/l4d2-panel/l4d2panel/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$artifact" ./cmd/agent
          sha256sum "$artifact" >"$artifact.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: l4d2panel-agent-${{ matrix.suffix }}
          path: |
            l4d2panel-agent-${{ matrix.suffix }}
            l4d2panel-agent-${{ matrix.suffix }}.sha256
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            l4d2panel-agent-${{ matrix.suffix }}
            l4d2panel-agent-${{ matrix.suffix }}.sha256

  windows-center:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Import optional code-signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Output 'Unsigned build requested.'; exit 0 }
          [IO.File]::WriteAllBytes('signing.pfx', [Convert]::FromBase64String($env:PFX_BASE64))
          $certificate = Import-PfxCertificate -FilePath signing.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          "WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build MSI, SBOM, notices, and hashes
        shell: pwsh
        env:
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v').Split('-', 2)[0]
          ./packaging/windows/Build-WindowsMSI.ps1 `
            -Version $version
      - name: Silent install and readiness smoke test
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist/windows-center -Filter *.msi | Select-Object -First 1
          $process = Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart', 'PROXY_MODE=caddy', 'PANEL_DOMAIN=localhost', 'CONTROL_PORT=18180', 'HTTP_PORT=18080', 'HTTPS_PORT=18443') -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "MSI install failed: $($process.ExitCode)" }
          foreach ($name in @('l4d2panel-control', 'l4d2panel-caddy')) {
            if ((Get-Service $name).Status -ne 'Running') { throw "$name is not running" }
          }
          if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18180/readyz).StatusCode -ne 200) { throw 'Control is not ready.' }
          if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18180/setup).StatusCode -ne 200) { throw 'Setup page is unavailable.' }
          if (Get-NetTCPConnection -State Listen -LocalPort 55432 -ErrorAction SilentlyContinue) { throw 'Legacy database port 55432 is listening.' }
          $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $bootstrap = Invoke-RestMethod -SkipCertificateCheck -WebSession $session -Uri https://localhost:18443/api/v1/auth/bootstrap
          if (-not $bootstrap.required -or -not $bootstrap.csrf_token) { throw 'First-owner setup is not available.' }
          $ownerBody = @{username='ci-owner'; display_name='CI Owner'; password='CI-Owner-Password-2026!'; password_confirmation='CI-Owner-Password-2026!'} | ConvertTo-Json
          $owner = Invoke-RestMethod -SkipCertificateCheck -WebSession $session -Method Post -ContentType 'application/json' -Headers @{'X-Bootstrap-CSRF-Token'=$bootstrap.csrf_token} -Body $ownerBody -Uri https://localhost:18443/api/v1/auth/bootstrap
          if ($owner.user.role -ne 'owner') { throw 'Website first-owner creation failed.' }
          $repair = Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart', 'REINSTALL=ALL', 'REINSTALLMODE=vomus') -Wait -PassThru
          if ($repair.ExitCode -notin @(0, 3010)) { throw "MSI repair/upgrade simulation failed: $($repair.ExitCode)" }
          $afterRepair = Invoke-RestMethod -SkipCertificateCheck -Uri https://localhost:18443/api/v1/auth/bootstrap
          if ($afterRepair.required) { throw 'Owner data was lost during MSI repair/upgrade simulation.' }
          $product = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object DisplayName -eq 'L4D2 Panel Center' | Select-Object -First 1
          if (-not $product) { throw 'Installed MSI registration was not found.' }
          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $product.PSChildName, '/qn', '/norestart') -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) { throw "MSI uninstall failed: $($uninstall.ExitCode)" }
          if (-not (Test-Path "$env:ProgramData\L4D2Panel\config\control.json")) { throw 'Ordinary uninstall removed retained data.' }
      - uses: actions/upload-artifact@v4
        with:
          name: l4d2panel-center-windows-x64
          path: |
            dist/windows-center/*.msi
            dist/windows-center/*.sha256
            dist/windows-center/*.json
            dist/windows-center/THIRD-PARTY-NOTICES.txt
      - name: Attach center MSI to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-center/*.msi
            dist/windows-center/*.sha256
            dist/windows-center/*.json
            dist/windows-center/THIRD-PARTY-NOTICES.txt
