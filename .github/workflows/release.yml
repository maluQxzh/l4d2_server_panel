name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
      - name: Build agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          artifact=l4d2panel-agent-${{ matrix.suffix }}
          go build -trimpath \
            -ldflags="-s -w -X github.com/l4d2-panel/l4d2panel/internal/version.Version=${GITHUB_REF_NAME} -X github.com/l4d2-panel/l4d2panel/internal/version.Commit=${GITHUB_SHA} -X github.com/l4d2-panel/l4d2panel/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$artifact" ./cmd/agent
          sha256sum "$artifact" >"$artifact.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: l4d2panel-agent-${{ matrix.suffix }}
          path: |
            l4d2panel-agent-${{ matrix.suffix }}
            l4d2panel-agent-${{ matrix.suffix }}.sha256
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            l4d2panel-agent-${{ matrix.suffix }}
            l4d2panel-agent-${{ matrix.suffix }}.sha256
