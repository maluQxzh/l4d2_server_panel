name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Reachable vulnerability scan
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  linux-agent:
    runs-on: ubuntu-latest
    container: debian:12-slim
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y ca-certificates git
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
      - name: Test agent on Debian
        run: go test ./internal/agent/...

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: l4d2panel_test
          POSTGRES_USER: l4d2panel
          POSTGRES_PASSWORD: integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U l4d2panel -d l4d2panel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Test migrations, credentials, and job locking
        env:
          TEST_DATABASE_URL: postgres://l4d2panel:integration-password@127.0.0.1:5432/l4d2panel_test?sslmode=disable
        run: go test ./internal/control -run TestPostgresMigrationsAndCredentialLifecycle -count=1
      - name: Simulate 20 nodes and 100 instances
        env:
          TEST_DATABASE_URL: postgres://l4d2panel:integration-password@127.0.0.1:5432/l4d2panel_test?sslmode=disable
          RUN_FLEET_ACCEPTANCE: '1'
        run: go test ./internal/control -run TestFleetScaleAcceptance -count=1 -timeout=2m

  agent-builds:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - goos: linux
            suffix: linux-amd64
          - goos: windows
            suffix: windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Cross-build supported Agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -o l4d2panel-agent-${{ matrix.suffix }} ./cmd/agent

  installers:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Linux installer
        if: runner.os == 'Linux'
        run: |
          sh -n scripts/install-agent.sh
          shellcheck scripts/install-agent.sh
      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install-agent.ps1), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm test -- --run
      - working-directory: web
        run: npm audit --audit-level=high
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    needs: [go, web, postgres-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-url-safe-password
          MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose config --quiet
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: l4d2panel/control:ci
