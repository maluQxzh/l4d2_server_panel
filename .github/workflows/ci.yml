name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Reachable vulnerability scan
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  linux-agent:
    runs-on: ubuntu-latest
    container: debian:12-slim
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y ca-certificates git
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
      - name: Test agent on Debian
        run: go test ./internal/agent/...

  sqlite-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - name: Test migrations, credentials, and job locking
        run: go test ./internal/control -run TestSQLiteMigrationsAndCredentialLifecycle -count=1
      - name: Simulate 20 nodes and 100 instances
        env:
          RUN_FLEET_ACCEPTANCE: '1'
        run: go test ./internal/control -run TestFleetScaleAcceptance -count=1 -timeout=2m -v

  cross-builds:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - goos: linux
            suffix: linux-amd64
          - goos: windows
            suffix: windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - name: Cross-build supported Control and Agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -o l4d2panel-control-${{ matrix.suffix }} ./cmd/control
          go build -trimpath -o l4d2panel-agent-${{ matrix.suffix }} ./cmd/agent

  windows-packaging:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate Windows packaging scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem packaging -Recurse -Filter *.ps1 | ForEach-Object FullName
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors | Format-List | Out-String | Write-Error }
          }
      - name: Cross-build native Windows Control
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -o "$env:RUNNER_TEMP\l4d2panel-control.exe" ./cmd/control
      - name: Build and validate Windows portable package
        shell: pwsh
        run: ./packaging/windows/Build-WindowsPortable.ps1 -Version 0.1.0

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm test -- --run
      - working-directory: web
        run: npm audit --audit-level=high
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    needs: [go, web, sqlite-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        env:
          CONTROL_IMAGE: l4d2panel/control:ci
        run: |
          bash -n packaging/container/build-container-offline.sh
          docker compose config --quiet
          docker compose --file deploy/docker-compose.image.yml config --quiet
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: l4d2panel/control:ci
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=control-image
          cache-to: type=gha,mode=max,scope=control-image
      - name: Start, restart, and verify SQLite persistence
        run: |
          docker compose up -d --build app
          for attempt in $(seq 1 30); do
            if docker compose exec -T app wget -qO- http://127.0.0.1:19090/readyz; then break; fi
            if [ "$attempt" = 30 ]; then docker compose logs app; exit 1; fi
            sleep 2
          done
          wget -qO- http://127.0.0.1:19090/readyz >/dev/null
          setup_key="$(docker compose exec -T app /usr/local/bin/l4d2panel setup-key issue)"
          printf '%s' "$setup_key" | grep -Eq '^l4d2p_setup_[A-Za-z0-9_-]{43}$'
          docker compose exec -T app wget -qO- http://127.0.0.1:19090/api/v1/auth/bootstrap | grep -q '"key_configured":true'
          unset setup_key
          docker compose exec -T app test -s /app/data/l4d2panel.sqlite3
          docker compose exec -T app test -S /var/run/docker.sock
          docker compose exec -T app sh -c 'test "$(stat -c "%u:%g" /app/updates)" = "100:101"'
          docker compose exec -T app sh -c "grep -Eq '^Uid:[[:space:]]+100[[:space:]]+100[[:space:]]+100[[:space:]]+100$' /proc/1/status"
          docker compose exec -T app sh -c "grep -Eq '^CapEff:[[:space:]]+0+$' /proc/1/status"
          test "$(docker compose exec -T app stat -c '%a' /app/data/control-master.key)" = 600
          master_key_hash_before="$(docker compose exec -T app sha256sum /app/data/control-master.key | awk '{print $1}')"
          docker compose stop app
          doctor=$(docker compose run --rm --no-deps app doctor)
          echo "$doctor" | grep -q '"database_engine":"sqlite"'
          echo "$doctor" | grep -q '"schema_status":"current"'
          docker compose up -d app
          for attempt in $(seq 1 30); do
            if docker compose exec -T app wget -qO- http://127.0.0.1:19090/readyz; then break; fi
            if [ "$attempt" = 30 ]; then docker compose logs app; exit 1; fi
            sleep 2
          done
          master_key_hash_after="$(docker compose exec -T app sha256sum /app/data/control-master.key | awk '{print $1}')"
          test "$master_key_hash_before" = "$master_key_hash_after"
          docker compose exec -T app wget -qO- http://127.0.0.1:19090/api/v1/auth/bootstrap | grep -q '"key_configured":true'
          docker compose down
