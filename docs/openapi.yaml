        content: { type: string }
        content_base64: { type: string, contentEncoding: base64 }

    FileWriteRequest:
      type: object
      properties:
        content: { type: string, maxLength: 8388608 }
        content_base64: { type: string, contentEncoding: base64 }
        expected_sha256: { type: string, pattern: "^[A-Fa-f0-9]{64}$" }
      description: content 与 content_base64 互斥；空对象创建/覆盖为空文本文件。

    ConfigFieldChange:
