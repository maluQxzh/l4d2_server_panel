          status,
          expires_at,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        name: { type: string, maxLength: 180 }
        platform: { type: string, enum: [windows/amd64, linux/amd64] }
        size: { type: integer, format: int64, minimum: 1, maximum: 21474836480 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        received_size: { type: integer, format: int64, minimum: 0 }
        status: { $ref: "#/components/schemas/BackupUploadStatus" }
        last_chunk_job_id: { type: string, format: uuid }
        restore_job_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BackupUploadEnvelope:
      type: object
      required: [upload, idempotent_replay]
      properties:
        upload: { $ref: "#/components/schemas/BackupUpload" }
        idempotent_replay: { type: boolean }

    CreateBackupUploadRequest:
      type: object
      additionalProperties: false
      required: [name, platform, size, sha256]
      properties:
        name:
          type: string
          maxLength: 180
          pattern: '^[^/\\\u0000\r\n]+[.][Zz][Ii][Pp]$'
          description: 去除首尾空白后的安全 basename；Control 另按 UTF-8 字节限制为 180。
        platform: { type: string, enum: [windows/amd64, linux/amd64] }
        size: { type: integer, format: int64, minimum: 1, maximum: 21474836480 }
        sha256: { type: string, pattern: "^[A-Fa-f0-9]{64}$" }

    BackupUploadChunkRequest:
      type: object
      additionalProperties: false
      required: [offset, chunk_sha256, content_base64]
      properties:
        offset: { type: integer, format: int64, minimum: 0 }
        chunk_sha256: { type: string, pattern: "^[A-Fa-f0-9]{64}$" }
        content_base64:
          {
            type: string,
            contentEncoding: base64,
            writeOnly: true,
            description: 解码后必须为 1–1048576 字节；中心数据库仅保存主密钥加密正文并在任务终态清除。,
          }

    BackupUploadJobReference:
      type: object
      required: [job_id, status, idempotent_replay]
      properties:
