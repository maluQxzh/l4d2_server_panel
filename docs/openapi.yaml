openapi: 3.1.0
info:
  title: L4D2 Panel API
  version: 1.0.0
  description: |
    L4D2 多节点服务器管理面板的 REST 契约。路径均相对于 `/api/v1`。
    安装、启停、更新、文件传输等长操作通常返回 `202` 与 `job_id`，再通过任务端点或
    `/events` WebSocket 跟踪。Cookie 会话的写请求必须发送 `X-CSRF-Token`；Bearer API
    Token 不使用 CSRF。要求交互式会话的端点不接受 API Token。
servers:
  - url: /api/v1
tags:
  - { name: Auth, description: 浏览器会话、TOTP 和 API Token }
  - { name: Events, description: 带游标重放的浏览器 WebSocket }
  - { name: Nodes, description: 节点注册、凭据和状态 }
  - { name: Environments, description: 节点依赖、SteamCMD 与独占游戏安装 }
  - { name: Instances, description: 实例生命周期和游戏操作 }
  - { name: Maps, description: 节点共享地图对象库和实例分配 }
  - { name: Files, description: 实例内白名单文件 }
  - { name: Transfers, description: 节点本地日志和备份的消费式分块传输 }
  - { name: Schedules, description: 实例计划任务 }
  - { name: Jobs, description: 持久化长任务 }
  - { name: Monitoring, description: 原始和聚合指标 }
  - { name: Notifications, description: 站内通知和外部投递 }
  - { name: Users, description: 团队账号和范围角色绑定 }
  - { name: System, description: Windows 便携中心端维护 }
  - { name: Audit, description: 不可编辑审计事件 }
  - { name: Public, description: 无需认证的公开状态 }
paths:
  /openapi.json:
    get:
      tags: [Public]
      security: []
      summary: 获取内置 API 路由摘要
      description: 内置 JSON 只用于轻量发现；本文件及 `/api/openapi.yaml` 是完整契约。
      responses:
        "200":
          description: OpenAPI 3.1 JSON 摘要
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /auth/bootstrap:
    get:
      tags: [Auth]
      security: []
      summary: 查询是否需要创建首个所有者
      description: |
        数据库没有用户时返回 `required=true` 和 `key_configured`，设置 15 分钟有效的
        HttpOnly/SameSite=Strict 引导 Cookie，并返回只用于本端点的 CSRF 令牌。
        已有用户时返回 `required=false`。
      responses:
        "200":
          description: 首次初始化状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapStatus" }
        "500":
          description: 无法读取初始化状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [Auth]
      security: []
      summary: 创建首个所有者并登录
      description: |
        仅数据库没有用户且本机已签发初始化密钥时可用。引导 Cookie 与
        `X-Bootstrap-CSRF-Token` 必须匹配；正确密钥将成为 `admin` 的初始密码。
        并发请求由数据库锁串行化，只有第一个成功请求能创建账号。成功后设置普通会话 Cookie。
        密钥相关稳定错误码为 `invalid_setup_key_format`、`setup_key_not_configured`、
        `invalid_setup_key` 和 `bootstrap_complete`。
      parameters:
        - name: X-Bootstrap-CSRF-Token
          in: header
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootstrapOwnerRequest" }
      responses:
        "201":
          description: 首个所有者创建成功并写入 HttpOnly 会话 Cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: 创建普通或首次激活浏览器会话
      description: 待激活账号在 password 中提交仅显示一次的密码；成功后该密码立即失效，并只签发最长 10 分钟的受限激活会话。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功并写入 HttpOnly 会话 Cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/activate:
    post:
      tags: [Auth]
      summary: 首次登录设置正式密码
      description: 仅待激活账号的交互式激活会话可用；原子设置 Argon2id 密码、销毁激活状态并轮换为普通会话。激活会话不能访问其他业务 API。
      x-interactive-session: true
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteActivationRequest" }
      responses:
        "200":
          description: 激活完成并写入新的普通 HttpOnly 会话 Cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/me:
    get:
      tags: [Auth]
      summary: 当前主体
      description: API Token 调用时 `api_token=true` 且 `csrf_token` 为空。
      responses:
        "200":
          description: 当前用户和会话信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 注销当前浏览器会话
      description: 仅交互式会话；API Token 会收到 `interactive_session_required`。
      x-interactive-session: true
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: 会话已删除且 Cookie 已失效 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/totp/setup:
    post:
      tags: [Auth]
      summary: 生成待确认的 TOTP 秘钥
      description: 仅交互式会话；秘钥和 otpauth URL 会在此响应返回。
      x-interactive-session: true
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: 待确认的 TOTP 配置
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_url]
                properties:
                  secret: { type: string, writeOnly: true }
                  otpauth_url: { type: string, format: uri, writeOnly: true }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/totp/confirm:
    post:
      tags: [Auth]
      summary: 确认 TOTP 并生成恢复码
      description: 十个恢复码只在本次响应显示；数据库只保存摘要。
      x-interactive-session: true
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: TOTP 已启用
          content:
            application/json:
              schema:
                type: object
                required: [enabled, recovery_codes]
                properties:
                  enabled: { type: boolean, const: true }
                  recovery_codes:
                    type: array
                    minItems: 10
                    maxItems: 10
                    items: { type: string, writeOnly: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api-tokens:
    get:
      tags: [Auth]
      summary: 列出当前用户的 API Token 元数据
      description: 仅交互式会话；从不返回 Token 明文或摘要。
      x-interactive-session: true
      responses:
        "200":
          description: Token 列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/APIToken" },
                    }
    post:
      tags: [Auth]
      summary: 创建有期限且可限定资源的 API Token
      description: 仅交互式会话；明文 `token` 只返回一次，权限不能超过当前用户绑定。
      x-interactive-session: true
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAPITokenRequest" }
      responses:
        "201":
          description: Token 已创建
          content:
            application/json:
              schema:
                type: object
                required: [api_token, token]
                properties:
                  api_token: { $ref: "#/components/schemas/APIToken" }
                  token: { type: string, pattern: "^l4d2p_", writeOnly: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api-tokens/{tokenId}:
    delete:
      tags: [Auth]
      summary: 吊销当前用户的 API Token
      x-interactive-session: true
      parameters:
        - { $ref: "#/components/parameters/TokenID" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "204": { description: 已吊销；重复吊销同一 Token 仍返回 204 }
        "404": { $ref: "#/components/responses/NotFound" }

  /events:
    get:
      tags: [Events]
      summary: 连接实时事件 WebSocket
      description: |
        必须请求 WebSocket Upgrade，Origin 必须同源。`cursor` 为最后成功处理的事件 ID；事件日志保留
        30 天，以每页 500 条、单连接最多 5000 条补齐遗漏。持久事件 ID 出现缺口时立即补齐，另每 2 秒
        检查遗漏尾部；瞬时控制台和指标帧不持久化并允许在慢客户端上丢弃。服务端按资源绑定过滤，权限
        代际变化时立即重验主体，并每 1 秒从数据库兜底重验；实时日志热路径不执行逐事件身份或资源查询。
        每 25 秒发送 Ping。
      parameters:
        - name: cursor
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        "101":
          { description: WebSocket 已建立，每个文本帧为一个 Event JSON 对象 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /agent/enroll:
    post:
      tags: [Nodes]
      security: []
      summary: Agent 使用一次性令牌注册
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentEnrollRequest" }
      responses:
        "201":
          description: 长期节点凭据只返回一次
          content:
            application/json:
              schema:
                type: object
                required: [node_id, credential]
                properties:
                  node_id: { type: string, format: uuid }
                  credential: { type: string, writeOnly: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /nodes:
    get:
      tags: [Nodes]
      summary: 列出有权读取的节点
      responses:
        "200":
          description: 节点列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Node" },
                    }

  /nodes/enrollment-tokens:
    post:
      tags: [Nodes]
      summary: 创建一次性节点注册令牌
      description: 需要全局 manage；明文令牌只返回一次。填写的 label 会成为节点注册后的显示名称。
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, minLength: 1, maxLength: 128, description: 节点注册后的显示名称 }
                name:
                  {
                    type: string,
                    deprecated: true,
                    description: label 的兼容别名,
                  }
                expires_in_minutes:
                  { type: integer, minimum: 1, maximum: 10080, default: 30 }
      responses:
        "201":
          description: 注册令牌
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token: { type: string, writeOnly: true }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /nodes/{nodeId}:
    parameters: [{ $ref: "#/components/parameters/NodeID" }]
    get:
      tags: [Nodes]
      summary: 获取节点
      responses:
        "200":
          description: 节点
          content:
            application/json:
              schema:
                type: object
                required: [node]
                properties:
                  node: { $ref: "#/components/schemas/Node" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Nodes]
      summary: 修改节点名称或公开连接地址
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                public_address:
                  type: [string, "null"]
                  description: 主机名、IPv4 或方括号 IPv6，不含 scheme、路径或端口；空字符串清除，null 表示不修改
      responses:
        "200":
          description: 节点已修改
          content:
            application/json:
              schema:
                type: object
                required: [node]
                properties:
                  node: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [Nodes]
      summary: 删除节点并断开 Agent
      description: 删除节点及中心端保存的实例、运行环境、游戏安装、地图、任务、指标、通知和资源权限绑定；审计与事件历史按既有保留策略保留，不删除 Agent 主机上的文件或进程。
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: 节点及中心端关联资源已删除，Agent 已断开 }
        "404": { $ref: "#/components/responses/NotFound" }

  /nodes/{nodeId}/credential/rotate:
    post:
      tags: [Nodes]
      summary: 轮换节点长期凭据
      description: 新凭据只返回一次；旧连接会立即断开，管理员必须安全更新 Agent 配置。
      parameters:
        - { $ref: "#/components/parameters/NodeID" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "200":
          description: 新凭据
          content:
            application/json:
              schema:
                type: object
                required: [credential]
                properties:
                  credential: { type: string, writeOnly: true }
        "404": { $ref: "#/components/responses/NotFound" }

  /nodes/{nodeId}/discoveries:
    post:
      tags: [Nodes]
      summary: 扫描节点白名单根内的 L4D2 安装
      description: |
        需要节点 manage 权限。扫描是有界、只读的节点任务，不跟随符号链接或 Windows 重解析点，
        结果只返回根索引和相对路径。节点必须在线并声明 `discover_instances` 能力；同一节点已有活动扫描时会复用任务。
      parameters:
        - { $ref: "#/components/parameters/NodeID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryRequest" }
      responses:
        "202":
          description: 扫描任务已排队或复用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /nodes/{nodeId}/discoveries/{jobId}:
    get:
      tags: [Nodes]
      summary: 获取节点安装扫描任务
      description: |
        只要求目标节点的 `nodes.discover`，不隐含 `jobs.read` 或 `jobs.details`。端点会再次校验任务属于
        路径中的节点且类型为 `discover_instances`；payload、发起人和幂等键不会返回，成功结果固定收敛为
        `DiscoveryResult`，未知字段不会透传。
      parameters:
        - { $ref: "#/components/parameters/NodeID" }
        - { $ref: "#/components/parameters/JobID" }
      responses:
        "200":
          description: 扫描任务；成功结果遵循 DiscoveryResult
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/DiscoveryJob" }
        "404": { $ref: "#/components/responses/NotFound" }

  /nodes/{nodeId}/quarantine:
    get:
      tags: [Nodes]
      summary: 列出节点中仍受管理的隔离条目
      description: |
        需要节点 manage 权限。只返回 Control 在隔离删除成功时记录的安全元数据，不返回节点绝对路径。
        `retention_expires_at` 到达前条目处于强制保留期；到期不会自动删除，仍须创建短效确认并提交永久清理。
      parameters:
        - { $ref: "#/components/parameters/NodeID" }
      responses:
        "200":
          description: 尚未确认永久清理的隔离条目
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/QuarantineEntry" },
                    }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /nodes/{nodeId}/quarantine/{entryId}/purge-confirmations:
    post:
      tags: [Nodes]
      summary: 为已到期隔离条目创建一次性永久清理确认
      description: |
        仅交互式浏览器会话且需要节点 manage 权限。条目必须已经完成七天强制保留期。
        明文令牌只返回一次、五分钟后过期，并以哈希形式绑定到当前用户和隔离条目。
      x-interactive-session: true
      parameters:
        - { $ref: "#/components/parameters/NodeID" }
        - { $ref: "#/components/parameters/QuarantineEntryID" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "201":
          description: 一次性确认已创建
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/QuarantinePurgeConfirmation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /nodes/{nodeId}/quarantine/{entryId}/purge:
    post:
      tags: [Nodes]
      summary: 确认并排队永久清理隔离条目
      description: |
        仅交互式浏览器会话。一次性令牌必须属于当前用户、节点和条目且仍在五分钟有效期内；消费和任务创建位于同一事务。
        重复提交不会创建第二个任务；只有携带与首次请求相同的非空 Idempotency-Key，且节点、条目和确认令牌完全相同，才会返回原任务。
        Agent 只接收根索引和严格 basename，并再次检查七天保留期、直属目录、符号链接与 Windows 重解析点后才删除。
      x-interactive-session: true
      parameters:
        - { $ref: "#/components/parameters/NodeID" }
        - { $ref: "#/components/parameters/QuarantineEntryID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuarantinePurgeRequest" }
      responses:
        "202":
          description: 永久清理任务已排队或为幂等重放
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments:
    get:
      tags: [Environments]
      summary: 列出有权读取的节点运行环境
      responses:
        "200":
          description: 运行环境列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RuntimeEnvironment" } }

  /environments/{environmentId}:
    parameters:
      - { name: environmentId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Environments]
      summary: 获取运行环境及已登记游戏安装
      responses:
        "200": { description: 运行环境详情 }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{environmentId}/inspect:
    post:
      tags: [Environments]
      summary: 手动检测系统依赖、活动 SteamCMD 和已登记游戏目录
      description: 不扫描磁盘；节点必须在线并声明 `runtime_environment_v1`。
      parameters:
        - { name: environmentId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202": { description: 检测任务已排队, content: { application/json: { schema: { $ref: "#/components/schemas/JobReference" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{environmentId}/steamcmd/actions:
    post:
      tags: [Environments]
      summary: 配置、清除、安装或修复节点默认 SteamCMD
      description: 自定义路径只在线校验后生效；固定文件名、普通文件、非链接且不得处于游戏根目录内。调用方不能提供可执行参数或环境变量。
      parameters:
        - { name: environmentId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [configure, clear, install, repair] }
                path: { type: string, maxLength: 4096 }
      responses:
        "202": { description: SteamCMD 操作已排队, content: { application/json: { schema: { $ref: "#/components/schemas/JobReference" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{environmentId}/game-installations:
    parameters:
      - { name: environmentId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Environments]
      summary: 列出运行环境中的游戏安装
      responses:
        "200": { description: 游戏安装列表 }
    post:
      tags: [Environments]
      summary: 安装 App 222860 或登记现有游戏目录
      description: 提交节点主机上的绝对目录路径，不触发目录扫描；需要 Agent 声明 `absolute_game_paths` 能力。服务模式导入会同时探测固定低权限账号的写权限；结构正确但不可写的路径保留在 Agent 本地登记中，节点管理员可重新执行同一 `install --config` 批量接管后重试检测。
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, operation]
              properties:
                path: { type: string, minLength: 1, maxLength: 1024, description: 节点 Windows 盘符绝对路径或 Linux 绝对路径 }
                operation: { type: string, enum: [install, import] }
      responses:
        "202": { description: 游戏安装记录和任务已创建 }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{environmentId}/game-installations/{installationId}/actions:
    post:
      tags: [Environments]
      summary: 手动维护游戏安装
      description: 需要目标节点的 `environments.manage`；提供检测/路径导入、Steam 校验修复和更新。
      parameters:
        - { name: environmentId, in: path, required: true, schema: { type: string } }
        - { name: installationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [install, import, validate, update] }
                path: { type: string, minLength: 1, maxLength: 1024, description: 仅 import 可用；节点主机绝对路径 }
      responses:
        "202": { description: 维护任务已排队, content: { application/json: { schema: { $ref: "#/components/schemas/JobReference" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{environmentId}/game-installations/{installationId}:
    delete:
      tags: [Environments]
      summary: 删除未绑定的游戏安装
      description: 需要交互式浏览器会话和 `environments.manage` 权限。`record` 只移除 Control 与 Agent 的登记，保留节点文件；`files` 还会永久删除登记的整个绝对路径目录。两种模式都拒绝仍绑定实例的安装，并需要 Agent 声明 `game_installation_delete_v1` 能力。
      parameters:
        - { name: environmentId, in: path, required: true, schema: { type: string } }
        - { name: installationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [record, files] }
      responses:
        "202": { description: 删除任务已排队, content: { application/json: { schema: { $ref: "#/components/schemas/JobReference" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances:
    get:
      tags: [Instances]
      summary: 列出有权读取的实例
      parameters:
        - { name: node_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 实例列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Instance" },
                    }
    post:
      tags: [Instances]
      summary: 绑定或导入游戏安装并创建实例
      description: "提交所选运行节点上已就绪且未绑定的 `game_installation_id`，或提交 `operation=import` 和节点绝对路径。路径导入会创建仅限本次请求绑定的临时安装记录，再由 Agent 检测 srcds 并完成登记；不能借此绑定其他 pending 安装。两种方式都不生成或注入 l4d2panel.cfg，也不会启动服务器。可选 RCON 密码只作为中心端加密连接凭据保存，必须与 server.cfg 一致。"
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInstanceRequest" }
      responses:
        "202":
          description: 实例记录和绑定任务已创建
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/JobReference" }
                  - type: object
                    required: [instance]
                    properties:
                      instance: { $ref: "#/components/schemas/Instance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Instances]
      summary: 获取实例
      responses:
        "200":
          description: 实例
          content:
            application/json:
              schema:
                type: object
                required: [instance]
                properties:
                  instance: { $ref: "#/components/schemas/Instance" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Instances]
      summary: 更新名称、结构化配置或停止实例的游戏端口并排队 configure
      description: |
        乐观并发版本位于 JSON 正文的 `version` 字段，不使用 `If-Match`。顶层 `rcon_password`
        只写入加密秘密存储，返回的配置不含明文，仅通过 `rcon_configured` 表示是否已设置；空字符串清除中心端凭据。
        客户端应始终提交当前非零修订号。更新只保留当前配置，不生成可查询或可回滚的历史版本。
        结构化配置不满足 InstanceConfig 的边界、安全 CVar 或启动参数规则时返回 `400 invalid_config`。
        `port` 仅能在实例状态为 `stopped` 时修改；Control 在任务期间同时保留旧端口并预留新端口，
        Agent 成功更新本地启动记录后才原子切换正式预留，失败或取消会释放待变更端口。
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchInstanceRequest" }
      responses:
        "200":
          description: 配置已保存且任务已排队
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/JobReference" }
                  - type: object
                    required: [instance]
                    properties:
                      instance: { $ref: "#/components/schemas/Instance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Instances]
      summary: 删除实例并解除游戏安装绑定
      description: 默认 `detach`，保留游戏文件。旧版显式 `quarantine` 仍受节点在线及隔离清理能力门控；新界面只执行解除绑定。
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - name: mode
          in: query
          schema:
            { type: string, enum: [detach, quarantine], default: detach }
      responses:
        "202":
          description: 删除/解除任务已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/actions:
    post:
      tags: [Instances]
      summary: 提交实例动作
      description: |
        权限按动作和目标实例范围检查：生命周期分别需要 `instances.start`、`instances.stop`、`instances.restart`；
        玩家动作分别需要 `players.kick`、`players.ban`、`players.unban`、`players.change_map`、`players.broadcast`；
        任意 RCON 需要 `rcon.execute`；备份创建/恢复分别需要 `backups.create`、`backups.restore`；包安装/启停分别需要
        `packages.install`、`packages.toggle`。`players.broadcast` 与
        `rcon.execute` 是互不包含的独立权限，安全广播不要求也不授予任意 RCON。
        `create_schedule` 除 `schedules.manage` 外，还需要计划目标动作对应的权限。
        游戏文件的 update、validate 使用运行环境专用端点，不属于实例通用动作。
        创建、导入、配置、文件、日志传输、备份下载和状态探测使用各自的专用端点，不能把对应内部任务类型提交到此通用端点。
        `delete` 与 `detach` 不属于通用动作，必须调用 `DELETE /instances/{instanceId}?mode=quarantine|detach`，
        以执行节点在线和隔离清理能力门控。提交 `kind=sourcemod` 或 `kind=sourcemod_url` 的包安装前，
        实例必须已有成功纳管且启用的 Metamod:Source，否则返回 409 `metamod_required`；Agent 还会复核实际加载文件。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceActionRequest" }
      responses:
        "202":
          description: 动作已排队；`create_schedule` 返回的 `job_id` 实际为 schedule ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/players:
    get:
      tags: [Instances]
      summary: 获取最近 RCON 玩家列表并异步刷新
      description: 返回最近成功缓存；运行中且已保存 RCON 凭据时，读取同时以 10 秒幂等桶排队后台探测 `rcon.players`。客户端直接根据 `status` 和 `refresh_job_id` 轮询本接口，不需要 `jobs.read` 权限。该任务没有用户发起人并始终归入后台探测；停止状态下 RCON 不可用。
      parameters: [{ $ref: "#/components/parameters/InstanceID" }]
      responses:
        "200":
          description: 已有玩家缓存、刷新失败，或当前无需刷新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerListResponse" }
        "202":
          description: 首次 RCON 玩家查询仍在执行
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerListResponse" }

  /instances/{instanceId}/bans:
    get:
      tags: [Instances]
      summary: 列出面板登记且仍有效的玩家封禁
      description: |
        数据来自成功的 `ban_player`/`unban_player` 任务结果，不是对服务器 ban 文件的实时反向扫描。
        已到期记录由查询和后台清理排除。
      parameters: [{ $ref: "#/components/parameters/InstanceID" }]
      responses:
        "200":
          description: 有效封禁列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/PlayerBan" },
                    }

  /instances/{instanceId}/packages:
    get:
      tags: [Instances]
      summary: 列出已登记的插件/VPK/Workshop 包
      parameters: [{ $ref: "#/components/parameters/InstanceID" }]
      responses:
        "200":
          description: 包元数据
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/AddonPackage" },
                    }

  /instances/{instanceId}/prepared-packages:
    get:
      tags: [Packages]
      summary: 列出实例最近的预下载包及消费进度
      description: >
        需要 packages.install，不要求 jobs.read。返回最近两小时最多 64 条准备记录，不含来源、正文或主机路径。
        supported 表示当前在线 Agent 支持 prepared_packages_v1；ready 表示准备成功、未过期且未提交消费。
        queues 返回最近 10 个服务端安装队列（活动优先）。queue_id 表示等待清单已预留该包；消费任务仍以终态且 busy=false 为完成边界。
      parameters: [{ $ref: "#/components/parameters/InstanceID" }]
      responses:
        "200":
          description: 持久准备记录
          content:
            application/json:
              schema:
                type: object
                required: [items, supported]
                properties:
                  supported: { type: boolean }
                  qq_flash_supported: { type: boolean, description: 当前在线 Agent 同时支持 prepared_packages_v1 与 prepared_qq_flash_v1 }
                  official_extensions_supported: { type: boolean, description: 当前在线 Agent 同时支持 prepared_packages_v1、prepared_extensions_v1 和 prepared_official_extensions_v1 }
                  extensions_supported: { type: boolean, description: 当前在线 Agent 支持 prepared_extensions_v1，可预下载第三方 SourceMod/Metamod 整包 }
                  workshop_supported: { type: boolean, description: 当前在线 Agent 支持 prepared_workshop_v1，可准备 Workshop 项目或合集 }
                  vpk_bundles_supported: { type: boolean, description: 当前在线 Agent 还支持 prepared_vpk_bundles_v1，可预下载多文件及 VPK 归档 }
                  items: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/PreparedPackage" } }
                  queues:
                    type: array
                    maxItems: 10
                    items:
                      type: object
                      required: [id, status, progress, message]
                      properties:
                        id: { type: string, format: uuid }
                        status: { type: string, enum: [queued, running, succeeded, failed, canceled] }
                        progress: { type: integer, minimum: 0, maximum: 100 }
                        message: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Packages]
      summary: 将单文件包或 QQ VPK 文件包预下载到节点暂存目录
      description: >
        需要 packages.install 和在线 Agent prepared_packages_v1。创建 prepare_package，不取得实例写锁。
        每节点最多 16 个准备槽、同时准备 2 个，共享节点下载限额。从开始准备起一小时有效。
        单文件默认接受 HTTPS 或 base64 上传之一；HTTPS 最大 512 MiB，上传解码后最大 100 MiB。
        name 是安全 basename，上传必须提供，HTTPS 可省略并从 URL 路径推导。
        source_transport=qq_flash 时额外需要 prepared_qq_flash_v1，source 为 QQ 分享 URL 或分享文本，
        不接受 name/content_base64；单文件类型要求分享恰好包含一个符合类型的文件且不超过 512 MiB，名称取验证后的分享元数据。
        kind=qq_vpk_bundle 仅接受 source_transport=qq_flash，并额外要求 prepared_vpk_bundles_v1。
        此类型允许多文件及仅含 VPK 的 ZIP/7Z/RAR（最多三层嵌套），下载和展开分别最多 2 GiB，
        最终 VPK 总计最多 2 GiB/1000 个，单个仍不得超过 512 MiB。每节点最多 4 个整包槽，包含在 Control 的 16 个总准备槽内。
        整包与单文件/智能预检共享 2 个执行槽，Agent 重启后仍可使用就绪整包；每个文件在安装前重新校验。
        kind=workshop 额外要求 prepared_workshop_v1，仅接受 source 为 1–20 位数字项目/合集 ID，禁止 name/content_base64/source_transport。
        每节点最多 4 个 Workshop 暂存槽（包含在总计 16 个槽内），单份快照最多 8 GiB/1000 文件、合集最多 200 项，沿用共享两个准备执行槽及一小时有效期。
        使用固定 Valve 接口和匿名 SteamCMD App 550，遵守节点 SteamCMD 并发限额，不解析 Workshop VPK 内容或套用 512 MiB 限制。
        准备只写节点暂存，重启可恢复；安装重新验证全部摘要和目标归属后 no-replace 提交，失败回滚新增文件。
        kind=sourcemod/metamod 额外要求 prepared_extensions_v1，默认接受调用者提供的 ZIP/tar.gz 上传、HTTPS 或单文件 QQ 分享。
        official=true 额外要求 prepared_official_extensions_v1，只接受 sourcemod/metamod 类型，禁止 source/content_base64/name/source_transport。
        Agent 按自身系统解析官方稳定版并保留固定白名单、回退及官方摘要保护的镜像策略；准备后固定版本、名称、归档 SHA-256 和大小。
        安装消费同一归档，不再解析或下载最新版，官方标记和版本只能由已完成的准备结果生成。
        组件预下载只校验文件名、大小与 SHA-256；归档展开和逐文件安全检查仍在正式安装时执行。
        第三方组件消费必须 acknowledge_native_risk=true，SourceMod 提交安装清单前须已有启用的 Metamod，逐项执行时重新检查依赖和文件归属。
        安装复用组件停服、检查点、保护 admins_simple.ini、A2S/RCON 验证和失败恢复。到期、取消或崩溃未完成的暂存由 Agent 回收。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              oneOf:
                - required: [source]
                  properties: { official: { const: false } }
                  not: { required: [content_base64] }
                - required: [content_base64, name]
                  properties: { official: { const: false } }
                  not: { required: [source] }
                - required: [official]
                  properties:
                    official: { const: true }
                    kind: { enum: [sourcemod, metamod] }
                  not:
                    anyOf:
                      - required: [source]
                      - required: [content_base64]
                      - required: [name]
                      - required: [source_transport]
              properties:
                official: { type: boolean, default: false, description: 仅组件可选择官方自动选版；不接受任何调用者来源或版本 }
                kind: { type: string, enum: [vpk, smx, plugin, native, qq_vpk_bundle, workshop, sourcemod, metamod] }
                source_transport: { type: string, enum: [qq_flash], description: Workshop 必须省略，其他类型省略时为 HTTPS 或上传；qq_flash 时 source 必填且 name/content_base64 禁止提供 }
                name: { type: string, minLength: 1, maxLength: 240, description: "安全文件名；VPK 为 .vpk，SMX/plugin 为 .smx，native 为 .dll 或 .so；sourcemod/metamod 为 .zip 或 .tar.gz；UTF-8 最多 240 字节" }
                source: { type: string, maxLength: 4096, description: HTTPS URL；Workshop 为 1–20 位数字项目/合集 ID；QQ 闪传模式也接受分享文本，服务端规范化为固定分享 URL }
                content_base64: { type: string, format: byte }
      responses:
        "202":
          description: 准备任务已排队或返回同一幂等任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/prepared-install-queues:
    post:
      tags: [Packages]
      summary: 持久保存预下载包的顺序安装清单
      description: >
        需要 packages.install 和非空 Idempotency-Key。按 prepared_ids 顺序接受 1–16 个已就绪且未过期的包，整批原子提交。
        每实例最多一个活动队列，返回 Control 本地协调任务 job_id；等待清单不持有实例写锁，不派发给 Agent。
        关闭页面或退出会话后继续执行。每项创建及首次派发前重新检查原用户当前权限、账号状态、
        原 API Token 的有效期/撤销/范围（若使用 Token）、准备有效期、实例状态和目标归属。
        上一安装任务终态且写锁释放后才创建下一任务。失败、过期或权限失效停止剩余清单；
        停止的未提交包解除预留，已创建安装任务的包仍只能消费一次。旧 Agent 或离线时等待兼容节点。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/CSRF" }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prepared_ids]
              properties:
                prepared_ids: { type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: { type: string, format: uuid } }
                acknowledge_native_risk: { type: boolean, default: false, description: 原生 DLL/SO 和第三方 SourceMod/Metamod 整包安装必须为 true }
                acknowledge_live_changes: { type: boolean, default: false, description: 智能插件在运行实例上安装时确认实时文件变化 }
                acknowledge_restart_required: { type: boolean, default: false, description: 智能插件安装完成后确认需要手动重启 }
                smart_packages:
                  type: object
                  additionalProperties:
                    type: array
                    minItems: 1
                    maxItems: 256
                    items:
                      type: object
                      additionalProperties: false
                      required: [folder_id]
                      properties:
                        folder_id: { type: string }
                        package_id: { type: string, format: uuid }
                        overrides: { type: object, additionalProperties: { type: string } }
                        takeovers: { type: array, maxItems: 5000, items: { type: string } }
      responses:
        "202":
          description: 队列已持久保存或返回原幂等任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/prepared-install-queues/{jobId}/cancel:
    post:
      tags: [Packages]
      summary: 停止服务端队列的后续安装
      description: >
        需要当前实例 packages.install，不要求 jobs.cancel。jobId 必须是本实例的协调任务。
        重复停止幂等；仅解除未提交条目的预留，已创建的安装任务继续执行，可在任务中心单独取消。
        不产生 Agent cancel_pending。成功/失败的已结束队列返回 conflict。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/JobID" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "200": { description: 队列已停止，返回 job 和 cancel_delivered=false }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/prepared-packages/{jobId}/install:
    post:
      tags: [Packages]
      summary: 安装已准备的包
      description: >
        需要 packages.install 和 Agent prepared_packages_v1。jobId 是准备任务 ID，且必须属于当前实例/节点。
        Control 从持久准备结果派生名称、类型、摘要和大小，不接受调用者指定目标路径。
        安装取得实例写锁并再次校验字节和目标归属；忙碌返回 conflict 和 reason=instance_busy，未创建消费任务。
        每个准备 ID 只接受一次安装或丢弃意图，失败或取消后须重新准备；原幂等键仍重放原任务。
        workshop 需要 prepared_workshop_v1，固定名称与文件清单来自已持久化的准备结果，安装前复核目标归属，投影逐项匹配原清单。
        qq_vpk_bundle 需要 prepared_vpk_bundles_v1；每个 VPK 的目标由准备 ID、序号和安全名称推导，
        重新校验完整清单、摘要、结构及 CRC 后才开始不覆盖写入，失败回滚本次新增文件。
        单文件 VPK/SMX 使用版本快照及失败回滚，原生扩展使用原子复制并强制风险确认；QQ VPK 整包沿用 QQ 导入的不覆盖语义。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/JobID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                acknowledge_native_risk: { type: boolean, default: false, description: 原生 DLL/SO 和第三方 SourceMod/Metamod 整包安装必须为 true }
      responses:
        "202":
          description: 安装任务已排队或返回同一幂等任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/prepared-packages/{jobId}:
    delete:
      tags: [Packages]
      summary: 丢弃已完成的预下载包
      description: >
        需要 packages.install 和 Agent prepared_packages_v1。创建 discard_prepared_package，不取得实例写锁。
        可以提交已过期的记录；不能丢弃已有消费意图的准备 ID。物理文件也可能已被 Agent 到期清理。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/JobID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202":
          description: 丢弃任务已排队或返回同一幂等任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/packages/{packageId}/rename:
    post:
      tags: [Packages]
      summary: 重命名已纳管模组或插件
      description: >
        需要 packages.install 和 Agent package_rename_v1。name 修改显示名称；filename 可选，
        仅支持 vpk/workshop/plugin/smx 的单文件同目录重命名，并要求实例 stopped。
        文件名须保留原扩展名，禁止路径、Windows 保留名、控制字符、地图保留前缀、覆盖现有文件及仅改变大小写。
        名称最多 240 个 UTF-8 字节。智能插件和整套 SourceMod/Metamod 仅允许改显示名称。
        从当前记录生成源路径及版本清单，成功后同步文件路径及版本历史。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { name: packageId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 240 }
                filename: { type: string, maxLength: 240 }
      responses:
        "202":
          description: 重命名任务已排队或返回同一幂等任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/package-operations/{jobId}:
    get:
      tags: [Packages]
      summary: 查询包操作进度及写锁释放状态
      description: >
        需要目标实例 packages.read。仅查询属于该实例的 toggle_package、delete_package、rename_package；
        不返回任务正文、结果、Agent 内部路径或诊断信息。批量界面等待终态且 busy=false 后再提交下一项；
        终态但投影未完成或取消待确认时 busy 仍为 true。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 包操作状态
          content:
            application/json:
              schema:
                type: object
                required: [status, busy]
                properties:
                  status: { type: string, enum: [queued, dispatched, running, succeeded, failed, canceled] }
                  busy: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /instances/{instanceId}/packages/scan:
    get:
      tags: [Packages]
      summary: 查看最近一次扫描及登记结果
      description: >
        需要 packages.install，不要求 jobs.read。仅返回状态与新增登记数量，不返回包清单、来源或主机路径。
        busy 包含执行中、取消待确认与结果待投影；outcome 独立于不可变 Agent 终态。
        succeeded 配合 stale 表示扫描期间有写操作或清单变更，未采用其结果，应在操作完成后重新扫描。
      parameters: [{ $ref: "#/components/parameters/InstanceID" }]
      responses:
        "200":
          description: 最近一次扫描；尚无记录时 scan 为 null
          content:
            application/json:
              schema:
                type: object
                required: [scan]
                properties:
                  scan:
                    nullable: true
                    type: object
                    required: [job_id, status, progress, busy, outcome, registered_count]
                    properties:
                      job_id: { type: string, format: uuid }
                      status: { type: string, enum: [queued, dispatched, running, succeeded, failed, canceled] }
                      progress: { type: integer, minimum: 0, maximum: 100 }
                      busy: { type: boolean }
                      outcome: { type: string, enum: [pending, applied, stale] }
                      registered_count: { type: integer, minimum: 0, maximum: 1000 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Packages]
      summary: 扫描并纳管实例中已安装的 VPK
      description: |
        需要 packages.install 和 package_scan_v1 Agent。调用方不能指定路径；Agent 只扫描
        left4dead2/addons 的直属 .vpk 普通文件，跳过地图库保留名称和所有子目录。每次最多处理
        1000 个候选，并通过 no-follow 文件句柄执行 512 MiB、VPK v1/v2 结构、边界、逐项 CRC、
        大小和 SHA-256 校验。有效且尚未按路径登记的文件会幂等投影为可启停、可删除的普通 VPK 包；
        无效文件只在任务结果中报告，不会被改写或删除。
        扫描不占实例写锁，每实例最多一个活动扫描（含取消待确认及投影）。Control 在创建时记录变更代际；
        创建时已有写任务、后续写任务或登记/目标变更会使结果作废，整批不纳管，提示重新扫描。
        已应用的投影重放不再写入；整包文件清单中的路径不会被扫描单独纳管。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202":
          description: 扫描任务已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/plugin-archives/inspections:
    post:
      tags: [Packages]
      summary: 识别本机上传或 QQ 闪传的插件压缩包
      description: |
        需要 packages.install 和 smart_plugin_archive_v2 Agent。本机方式仅接受不超过 100 MiB 的 ZIP、7Z 或
        单卷 RAR；qq_flash 方式另需 qq_flash_plugin_packages_v1，分享最多下载 2 GiB 且必须恰好包含一个实际包文件。
        Agent 在实例根之外安全展开并返回按顶层插件文件夹分组的逐文件目标路径预览；
        不写入实例。ZIP 路径编码支持 auto、utf8、gbk、big5；auto 优先 UTF-8 并对旧式无效 UTF-8 名称回退 GBK。
        TXT、CFG 和无法确定类别的裸 DLL/SO 会标为歧义项并给出受限候选路径。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required: [name, content_base64]
                - required: [source, source_transport]
              properties:
                name: { type: string, description: 仅文件名 }
                content_base64: { type: string, format: byte, writeOnly: true }
                source: { type: string, description: QQ 闪传分享链接或包含唯一链接的分享文本, writeOnly: true }
                source_transport: { type: string, const: qq_flash }
                path_encoding:
                  type: string
                  enum: [auto, utf8, gbk, big5]
                  default: auto
                  description: ZIP 内部路径编码；显式 GBK/Big5 可覆盖来源错误设置的 UTF-8 标志。
      responses:
        "202":
          description: 识别任务已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/plugin-archives/inspections/{jobId}:
    get:
      tags: [Packages]
      summary: 获取插件压缩包识别结果
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/JobID" }
      responses:
        "200":
          description: 识别任务状态；成功时包含 plan
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status, progress]
                properties:
                  job_id: { type: string, format: uuid }
                  status: { type: string }
                  progress: { type: integer }
                  message: { type: string }
                  error: { type: string }
                  plan: { $ref: "#/components/schemas/SmartPluginPlan" }

  /instances/{instanceId}/packages/{packageId}/versions:
    get:
      tags: [Instances]
      summary: 列出包的节点本地历史版本
      description: |
        当前仅非 Workshop 单文件 VPK 和 SourceMod SMX 生成历史版本；每个目标最多保留最近 3 个。
        响应不包含 Agent 数据目录中的存储路径。不存在历史记录（包括未知 packageId）时返回空数组。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/PackageID" }
      responses:
        "200":
          description: 按创建时间倒序排列的包版本
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      maxItems: 3,
                      items:
                        { $ref: "#/components/schemas/AddonPackageVersion" },
                    }

  /instances/{instanceId}/packages/{packageId}:
    get:
      tags: [Packages]
      summary: 查看受管包及其逐文件清单
      description: 需要 packages.read。智能识别包和新版 SourceMod/Metamod 整套组件返回安装时登记的所有实例相对路径；旧式单文件包返回其目标路径，未记录逐文件信息的旧式整包返回空清单。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/PackageID" }
      responses:
        "200":
          description: 包详情和文件清单
          content:
            application/json:
              schema:
                type: object
                required: [package, files]
                properties:
                  package: { $ref: "#/components/schemas/AddonPackage" }
                  files: { type: array, items: { $ref: "#/components/schemas/AddonPackageFile" } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Packages]
      summary: 删除一个受管模组、智能插件或整套服务端组件
      description: |
        需要 packages.delete。单文件包仅支持面板登记且路径位于标准目录的 VPK 或 SourceMod SMX。
        智能插件必须先停止实例；默认逐文件复核 SHA-256，发现漂移或缺失时拒绝删除。显式确认后可通过
        allow_changed_files=1 继续删除；preserve_changed_config=1 会保留已修改的 CFG/INI/TXT/JSON/KV/RES 配置，
        缺失文件按已删除处理，异常的程序/入口文件仍会删除。返回的任务结果会列出 changed_files、missing_files 和 preserved_config_files。
        SourceMod/Metamod 整套组件也必须先停止实例，并要求 component_package_delete_v1 Agent 和安装后生成的非空逐文件清单；
        Agent 复核固定组件目录、大小和 SHA-256，创建检查点后只删除清单文件。SourceMod 的
        left4dead2/addons/sourcemod/configs/admins_simple.ini 始终保留；SourceMod 记录存在时不能删除 Metamod。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/PackageID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - name: allow_changed_files
          in: query
          required: false
          description: 交互式确认后允许删除已修改或异常的智能插件文件。
          schema: { type: boolean, default: false }
        - name: preserve_changed_config
          in: query
          required: false
          description: 保留已修改的智能插件配置文件；仅在 allow_changed_files=true 时生效。
          schema: { type: boolean, default: false }
      responses:
        "202":
          description: 删除任务已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/packages/{packageId}/files/content:
    get:
      tags: [Packages]
      summary: 读取智能插件的受管文本文件
      description: 需要 files.read 以及 smart_plugin_file_edit_v1 Agent。只读取逐文件清单内标记为可编辑的 UTF-8 文本，并复核清单与磁盘 SHA-256。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/PackageID" }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: 文件正文和 SHA-256 }
        "202": { description: 节点读取任务正在执行 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    put:
      tags: [Packages]
      summary: 编辑智能插件的受管文本文件
      description: |
        需要 files.write 以及 smart_plugin_file_edit_v1 Agent。仅允许智能插件清单内的非入口 `.cfg`、`.txt`、
        `.sp`、`.inc`、`.nut` UTF-8 文本，最大 8 MiB。Agent 以读取时 SHA-256 做并发保护，原子写入后同步
        智能插件清单与聚合哈希；SMX、DLL、SO、VDF、autoload 等加载入口保持只读。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/PackageID" }
        - name: path
          in: query
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, expected_sha256]
              properties:
                content: { type: string, maxLength: 8388608, writeOnly: true }
                expected_sha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
      responses:
        "202": { description: 文件编辑任务已排队, content: { application/json: { schema: { $ref: "#/components/schemas/JobReference" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/packages/{packageId}/versions/{versionId}/rollback:
    post:
      tags: [Instances]
      summary: 回退到一个节点本地包版本
      description: |
        需要实例 manage 权限。仅支持已启用、路径未变化的 VPK/SMX；已是当前版本会被拒绝。
        Agent 在替换前保存当前文件，校验快照和 SHA-256，必要时停服并在完成后恢复运行；失败会恢复原文件。
        成功回退会消费所选快照并把先前当前文件作为新的历史版本保存。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/PackageID" }
        - { $ref: "#/components/parameters/PackageVersionID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202":
          description: 回退任务已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/backups:
    get:
      tags: [Instances]
      summary: 列出节点本地备份元数据
      description: 需要目标实例的 `backups.read`；不返回节点路径。常规 v4 归档只包含配置和 Control 登记且非本机扫描来源的包文件，并记录无秘密启动快照及地图引用；每日任务产生的新周副本会独立投影到列表。用户主动创建的插件 7z 归档也会以 `plugin_preserve` 或 `plugin_compact` 类型返回。
      parameters: [{ $ref: "#/components/parameters/InstanceID" }]
      responses:
        "200":
          description: 不包含节点文件路径
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/BackupSummary" },
                    }

  /instances/{instanceId}/plugin-backups:
    post:
      tags: [Instances]
      summary: 主动创建插件 7z 备份
      description: |
        需要目标实例的 `backups.create`。Control 从插件记录生成不可由调用者修改的文件清单，Agent 在实例边界内
        逐文件 no-follow 打开并复核当前大小和实际读取长度，但允许当前大小和内容不同于安装时的登记值；随后创建
        最多 5000 个文件、2 GiB 展开量的 7z，并为最终归档计算 SHA-256。
        每个插件使用独立顶层文件夹；preserve 保留从 left4dead2 开始的游戏路径，compact 去掉游戏和 SourceMod 根目录，
        但保留 plugins、gamedata、configs、cfg 等相对结构。归档只支持下载和删除，不能作为实例恢复源。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layout]
              additionalProperties: false
              properties:
                layout: { type: string, enum: [preserve, compact] }
      responses:
        "202":
          description: 插件备份任务已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/backups/{backupId}:
    delete:
      tags: [Instances]
      summary: 永久删除节点本地备份
      description: 需要目标实例的 `backups.delete`。不接受请求正文或 Agent 路径；Agent 会在固定实例备份目录中复核名称、大小和 SHA-256 后删除常规 ZIP 或插件 7z，文件已经不存在时按幂等成功处理。Control 只在 Agent 成功后删除备份元数据。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/BackupID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202":
          description: 删除任务已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/backups/{backupId}/downloads:
    post:
      tags: [Transfers]
      summary: 创建一个备份下载分块任务
      description: 需要目标实例的 `backups.download`。备份仍保存在节点；Agent 校验备份目录边界、总大小和完整文件 SHA-256。单块最大 1 MiB。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/BackupID" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupChunkRequest" }
      responses:
        "202":
          description: 分块任务已创建；Location 和 poll_url 指向轮询端点
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferReference" }
        "416": { $ref: "#/components/responses/RangeNotSatisfiable" }

  /instances/{instanceId}/backups/{backupId}/downloads/{jobId}:
    get:
      tags: [Transfers]
      summary: 获取并消费备份分块
      description: 需要目标实例的 `backups.download`。成功读取后该任务的加密正文被删除；下一块必须创建新任务。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/BackupID" }
        - { $ref: "#/components/parameters/JobID" }
      responses:
        "206": { $ref: "#/components/responses/BinaryChunk" }
        "202": { $ref: "#/components/responses/TransferPending" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }

  /instances/{instanceId}/backup-uploads:
    post:
      tags: [Transfers]
      summary: 创建可续传的跨节点备份上传会话
      description: |
        需要目标实例的 `backups.restore`。Control 只保存会话元数据和加密任务块，正文分块直接暂存在目标 Agent；
        会话初始有效期 24 小时，每个成功分块会把有效期续到当时起 24 小时。同一非空 Idempotency-Key
        与完全相同的元数据重放返回 200 和原会话；冲突元数据返回 409。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBackupUploadRequest" }
      responses:
        "201":
          description: 上传会话已创建
          headers:
            Location:
              { schema: { type: string }, description: 新会话的 GET 端点。 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupUploadEnvelope" }
        "200":
          description: Idempotency-Key 重放原上传会话
          headers:
            Location:
              { schema: { type: string }, description: 原会话的 GET 端点。 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupUploadEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/backup-uploads/{uploadId}:
    get:
      tags: [Transfers]
      summary: 获取备份上传会话进度
      description: 需要目标实例的 `backups.restore`；响应不包含 Agent 路径或已上传正文。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/BackupUploadID" }
      responses:
        "200":
          description: 上传会话
          content:
            application/json:
              schema:
                type: object
                required: [upload]
                properties:
                  upload: { $ref: "#/components/schemas/BackupUpload" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      tags: [Transfers]
      summary: 放弃备份上传会话并排队清理节点暂存
      description: |
        需要目标实例的 `backups.restore`、CSRF（浏览器会话）和非空 Idempotency-Key；不接受请求正文。
        仅 uploading、ready 或 failed 且没有活跃、cancel_pending 或终态尚未投影的 chunk/restore
        任务时可执行。Control 在同一事务把会话标记为 expired，并创建实例范围但不占用游戏写锁的
        backup.upload.abort 任务。Agent 只按 upload UUID 删除受信任暂存文件，不提供通用文件或 Shell 能力。
        相同用户、键、实例和 upload 重放原任务且不重复发布 queued 事件；不同目标返回 409。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/BackupUploadID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      responses:
        "202":
          description: 暂存清理任务已排队或幂等重放
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupUploadJobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/backup-uploads/{uploadId}/chunks:
    post:
      tags: [Transfers]
      summary: 排队写入一个校验后的备份上传分块
      description: |
        需要目标实例的 `backups.restore` 和非空 Idempotency-Key。解码正文为 1–1048576 字节，块 SHA-256 必须匹配；
        offset 必须等于会话当前 received_size 且不能越过总 size。客户端应通过专用分块状态端点等待任务终态，
        并观察会话 received_size 前进后再提交下一块；该轮询只需 `backups.restore`，不隐含通用任务权限。
        相同键只在 offset、块摘要和正文完全相同时重放原任务；
        会话续期等服务端字段不参与请求身份。最后一块还会在 Agent 校验完整大小和会话 SHA-256 后原子完成暂存文件。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/BackupUploadID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupUploadChunkRequest" }
      responses:
        "202":
          description: 分块写入任务已排队或重放
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupUploadJobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/backup-uploads/{uploadId}/chunks/{jobId}:
    get:
      tags: [Transfers]
      summary: 获取备份上传分块任务状态
      description: |
        只需要目标实例的 `backups.restore`，不隐含 `jobs.read` 或 `jobs.details`。端点会再次校验任务属于
        路径中的实例、上传会话且类型固定为 backup.upload.chunk；响应只返回 job_id 和 status，不返回任务正文、
        结果、请求者、幂等键或 Agent 消息。失败或取消后客户端应清除该分块的旧幂等键，再以新键安全重试。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/BackupUploadID" }
        - { $ref: "#/components/parameters/JobID" }
      responses:
        "200":
          description: 固定结构的分块任务状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupUploadChunkStatus" }
        "404": { $ref: "#/components/responses/NotFound" }

  /instances/{instanceId}/backup-uploads/{uploadId}/complete:
    post:
      tags: [Transfers]
      summary: 完成备份上传并排队恢复
      description: |
        需要目标实例的 `backups.restore`。仅状态为 ready、received_size 等于 size 且未过期的会话可恢复；无请求正文。
        恢复前仍会创建检查点并要求停服。v2 使用来源模式、地图、人数、高级参数、自动重启和安全 CVar，
        但保留目标端口和中心端 RCON 凭据；server.cfg 作为普通可移植配置恢复，v1 保留目标启动资料。来源和目标平台不同时，Agent 先安装并验证
        目标平台 Metamod/SourceMod，再最终覆盖来源可移植数据，避免官方默认配置覆盖用户文件；失败会回滚检查点和实例状态。
        v2 成功后 Control 会再次验证无秘密启动投影，并以独立的 restore 任务投影标记幂等更新目标实例当前配置；不会保留配置历史正文。
        同一 Idempotency-Key 始终重放原任务（包括原失败任务）；失败或取消后会话续期 24 小时，改用新键可直接重试恢复而无需重新上传。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/BackupUploadID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202":
          description: restore 任务已排队或重放
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupUploadJobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /instances/{instanceId}/logs/search:
    post:
      tags: [Transfers]
      summary: 创建节点本地日志的有限检索任务
      description: 最多返回 1000 行和 384 KiB；关键字和结果在中心以主密钥加密暂存。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogSearchRequest" }
      responses:
        "202":
          description: 搜索任务已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferReference" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /instances/{instanceId}/logs/search/{jobId}:
    get:
      tags: [Transfers]
      summary: 获取并消费日志检索结果
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/JobID" }
      responses:
        "200":
          description: 搜索结果；成功响应后正文从任务记录删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogSearchResponse" }
        "202": { $ref: "#/components/responses/TransferPending" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }

  /instances/{instanceId}/logs/downloads:
    post:
      tags: [Transfers]
      summary: 创建日志分块下载任务
      description: "`segment=0` 为当前日志，1–19 为轮转段；单块最大 1 MiB。"
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogChunkRequest" }
      responses:
        "202":
          description: 分块任务已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferReference" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /instances/{instanceId}/logs/downloads/{jobId}:
    get:
      tags: [Transfers]
      summary: 获取并消费日志分块
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/JobID" }
      responses:
        "206": { $ref: "#/components/responses/BinaryChunk" }
        "202": { $ref: "#/components/responses/TransferPending" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }

  /instances/{instanceId}/schedules:
    get:
      tags: [Schedules]
      summary: 列出实例计划任务
      description: 需要目标实例的 `schedules.read`。
      parameters: [{ $ref: "#/components/parameters/InstanceID" }]
      responses:
        "200":
          description: 计划列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Schedule" },
                    }

  /instances/{instanceId}/schedules/{scheduleId}:
    patch:
      tags: [Schedules]
      summary: 启用或停用计划
      description: 需要目标实例的 `schedules.manage`；计划创建时已经另外校验目标动作权限。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/ScheduleID" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: 计划已修改；重新启用会重新计算 next_run_at
          content:
            application/json:
              schema:
                type: object
                required: [schedule]
                properties:
                  schedule: { $ref: "#/components/schemas/Schedule" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Schedules]
      summary: 删除计划
      description: 需要目标实例的 `schedules.manage`。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/ScheduleID" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }

  /instances/{instanceId}/files:
    get:
      tags: [Files]
      summary: 列出白名单目录
      description: 返回最近成功缓存并异步刷新；无缓存时以 202/loading 明确表示正在读取。只列出 cfg、addons、logs 及其 left4dead2 对应目录；shortcuts 仅在安全确认目标普通文件存在时返回。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { name: path, in: query, schema: { type: string, default: "" } }
      responses:
        "200":
          description: 文件列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileListResponse" }
        "202":
          description: 首次目录读取正在执行
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileListResponse" }

  /instances/{instanceId}/files/content:
    get:
      tags: [Files]
      summary: 读取最多 8 MiB 的白名单文件
      description: 需要实例 operate。若无缓存先返回 202；缓存超过 5 秒会在返回旧内容的同时附带 refresh_job_id。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/FilePath" }
      responses:
        "200":
          description: UTF-8 文本用 content，其他文件用 content_base64
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileContentResponse" }
        "202":
          description: 正在读取
          content:
            application/json:
              schema:
                type: object
                required: [job_id, path, status]
                properties:
                  job_id: { type: string, format: uuid }
                  path: { type: string }
                  status: { type: string, const: loading }
        "400": { $ref: "#/components/responses/BadRequest" }
    put:
      tags: [Files]
      summary: 原子写入最多 8 MiB 的白名单文件
      description: "`expected_sha256` 为空表示不做前置条件；明文/二进制正文在任务中加密保存。可执行和加载关键扩展名被拒绝，必须使用包管理流程。"
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/FilePath" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileWriteRequest" }
      responses:
        "202":
          description: 写入任务已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [Files]
      summary: 删除单个白名单文件
      description: 不支持递归目录删除。`If-Match` 可传当前 SHA-256（可带双引号）。可执行和加载关键扩展名被拒绝，必须使用包管理流程。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/FilePath" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatchSHA256" }
      responses:
        "202":
          description: 删除任务已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /instances/{instanceId}/packages/qq-flash:
    post:
      tags: [Packages]
      summary: 由 Agent 从 QQ 闪传分享链接导入受管 VPK
      description: >
        需要 packages.install。只接受 qfile.qq.com 的 HTTPS 分享链接；Agent 从固定腾讯主机下载到节点暂存区，
        Control 不转发文件正文。直接 VPK 及最多三层 ZIP、7Z、RAR 会在路径、数量、下载/展开大小、压缩比、
        VPK 结构和 CRC 全部通过后提交；加密包、链接和任意非 VPK 普通文件会拒绝整次导入。
        每个成功 VPK 都建立可启停、可删除的独立包记录。
      parameters:
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QQFlashFileImportRequest" }
      responses:
        "202":
          description: 节点直连 VPK 导入任务已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /maps:
    get:
      tags: [Maps]
      summary: 列出可见地图
      description: 需要地图所属节点或该节点内已绑定实例的 `maps.read`；可用 node_id 查询参数筛选。响应包含 BSP、持久警告、卷副本健康和实例分配，不包含节点绝对路径或 QQ 链接。
      parameters:
        - name: node_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 地图列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Map" } }

  /maps/{mapId}:
    get:
      tags: [Maps]
      summary: 获取地图详情
      parameters: [{ $ref: "#/components/parameters/MapID" }]
      responses:
        "200":
          description: 地图详情
          content:
            application/json:
              schema:
                type: object
                required: [map]
                properties: { map: { $ref: "#/components/schemas/Map" } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Maps]
      summary: 永久删除未分配地图
      description: 需要节点/全局 `maps.delete`，或同节点实例范围的 `maps.delete` 且地图由当前账号导入；另需交互式会话及五分钟有效的一次性确认令牌。Agent 发现未知硬链接或不一致时保留记录并允许重试。
      parameters:
        - { $ref: "#/components/parameters/MapID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation_token]
              properties: { confirmation_token: { type: string } }
      responses:
        "202": { description: 删除任务已排队, content: { application/json: { schema: { $ref: "#/components/schemas/JobReference" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /maps/{mapId}/poster:
    get:
      tags: [Maps]
      summary: 获取地图海报
      description: 需要地图所属节点或该节点内已绑定实例的 `maps.read`。仅返回 Agent 在导入时从 mission/VMT/VTF 受限转换并由 Control 持久化的 JPEG；没有可用海报时返回 404，由网页使用内置默认海报。
      parameters: [{ $ref: "#/components/parameters/MapID" }]
      responses:
        "200":
          description: 地图海报 JPEG
          content:
            image/jpeg:
              schema: { type: string, format: binary, maxLength: 1048576 }
        "404": { $ref: "#/components/responses/NotFound" }

  /nodes/{nodeId}/maps/imports:
    post:
      tags: [Maps]
      summary: 从 QQ 闪传导入一张逻辑地图
      description: 需要节点/全局 `maps.import`，或该节点内已绑定实例的 `maps.import`，以及 map_library_v1 Agent。分享链接加密进入任务且不回显；节点完整枚举后下载，递归处理最多三层 ZIP/7Z/RAR，只展开 VPK、外部分卷和嵌套归档，最终保留确定性服务端 VPK。显式路径编码需要 map_import_v2；失败任务在有 jobs.details 权限时返回阶段、稳定错误码和修复建议。
      parameters:
        - { $ref: "#/components/parameters/NodeID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [share_url]
              properties:
                share_url: { type: string, format: uri, pattern: '^https://qfile\.qq\.com/q/' }
                path_encoding:
                  type: string
                  enum: [auto, utf8, gbk, big5]
                  default: auto
                  description: ZIP 与 VPK 内部路径编码。auto 优先 UTF-8，仅在无效时回退 GBK；显式值覆盖 ZIP 的编码标志。
      responses:
        "202": { description: 导入任务已排队, content: { application/json: { schema: { $ref: "#/components/schemas/JobReference" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /maps/{mapId}/assignments/{instanceId}:
    put:
      tags: [Maps]
      summary: 分配地图给同节点实例
      description: 需要通过节点绑定或同节点实例绑定获得地图所属节点的 `maps.read`，并具备目标实例的 `maps.assign`。运行中也可分配；已配置 RCON 时 Agent 会在硬链接提交后执行固定的 sm_update_vpk，无需重启。未配置 RCON 时仍完成分配，但管理员需要在游戏内手动输入 !update_vpk。使用节点地图锁和实例写锁，不占用 SteamCMD 槽。
      parameters:
        - { $ref: "#/components/parameters/MapID" }
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202": { description: 分配任务已排队, content: { application/json: { schema: { $ref: "#/components/schemas/JobReference" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Maps]
      summary: 取消地图分配
      description: 需要通过节点绑定或同节点实例绑定获得地图所属节点的 `maps.read`，并具备目标实例的 `maps.assign`。Control 与 Agent 都要求实例真实停止；重复取消按幂等成功处理。
      parameters:
        - { $ref: "#/components/parameters/MapID" }
        - { $ref: "#/components/parameters/InstanceID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202": { description: 取消任务已排队, content: { application/json: { schema: { $ref: "#/components/schemas/JobReference" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /maps/{mapId}/verify:
    post:
      tags: [Maps]
      summary: 校验并尽可能修复地图副本
      description: 需要节点/全局 `maps.verify`，或该节点内已绑定实例的 `maps.verify`。
      parameters:
        - { $ref: "#/components/parameters/MapID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202": { description: 校验任务已排队, content: { application/json: { schema: { $ref: "#/components/schemas/JobReference" } } } }

  /maps/{mapId}/delete-confirmations:
    post:
      tags: [Maps]
      summary: 签发地图永久删除确认令牌
      description: 仅交互式会话；令牌一次性且五分钟有效，已有分配时拒绝。
      parameters:
        - { $ref: "#/components/parameters/MapID" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "201":
          description: 确认令牌
          content:
            application/json:
              schema:
                type: object
                required: [confirmation_token, expires_at]
                properties:
                  confirmation_token: { type: string, writeOnly: true }
                  expires_at: { type: string, format: date-time }

  /jobs:
    get:
      tags: [Jobs]
      summary: 列出有权读取的任务
      parameters:
        - { name: node_id, in: query, schema: { type: string, format: uuid } }
        - {
            name: instance_id,
            in: query,
            schema: { type: string, format: uuid },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, default: 100, maximum: 500 },
          }
        - {
            name: background,
            in: query,
            description: 周期性只读探测任务的筛选方式，包括玩家页触发的 RCON 玩家刷新；默认 include 保持 API 向后兼容，任务中心和实例最近操作使用 exclude 或 only 分开显示,
            schema: { type: string, enum: [include, exclude, only], default: include },
          }
        - {
            name: background_summary,
            in: query,
            description: 是否返回调用者有权读取目标的最新后台探测聚合状态,
            schema: { type: boolean, default: false },
          }
      responses:
        "200":
          description: 任务列表；对任务目标资源仅有 read 的调用者看不到 payload/result，加密字段和 Agent 内部存储定位符永不返回
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    { type: array, items: { $ref: "#/components/schemas/Job" } }
                  background_summary:
                    type: object
                    description: 最近最多 500 条可见后台探测中，每个实例或节点任务目标的最新状态
                    required: [targets, active, failed]
                    properties:
                      targets: { type: integer, minimum: 0 }
                      active: { type: integer, minimum: 0 }
                      failed: { type: integer, minimum: 0 }
                      latest_at: { type: string, format: date-time }

  /jobs/{jobId}:
    get:
      tags: [Jobs]
      summary: 获取任务
      description: |
        对任务实际节点/实例范围具备 `jobs.read` 或 `jobs.details` 任一权限即可读取。
        仅有 `jobs.read` 时 payload/result 为空；`jobs.details` 可独立读取经服务端剥离秘密字段后的正文和结果，
        但不授予任务列表权限。
      parameters: [{ $ref: "#/components/parameters/JobID" }]
      responses:
        "200":
          description: 任务
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{jobId}/cancel:
    post:
      tags: [Jobs]
      summary: 取消尚未完成的任务
      parameters:
        - { $ref: "#/components/parameters/JobID" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "200":
          description: 数据库状态已取消；cancel_delivered 表示是否已把取消帧发送给运行 Agent
          content:
            application/json:
              schema:
                type: object
                required: [job, cancel_delivered]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
                  cancel_delivered: { type: boolean }
        "409": { $ref: "#/components/responses/Conflict" }

  /jobs/terminal-conflicts:
    get:
      tags: [Jobs]
      summary: 列出 Agent 最终结果与中心端不可变记录的冲突
      description: 仅允许交互式浏览器会话中的全局所有者访问；默认只返回尚未确认的冲突，不包含 Agent 原始结果正文。
      parameters:
        - { name: active, in: query, schema: { type: boolean, default: true } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: 冲突列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TerminalOutcomeConflict" } }

  /jobs/{jobId}/terminal-conflict:
    get:
      tags: [Jobs]
      summary: 获取任务最终结果冲突
      description: 仅允许交互式浏览器会话中的全局所有者访问。
      parameters:
        - { $ref: "#/components/parameters/JobID" }
        - { name: reported_fingerprint, in: query, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
      responses:
        "200":
          description: 冲突记录
          content:
            application/json:
              schema:
                type: object
                required: [conflict]
                properties:
                  conflict: { $ref: "#/components/schemas/TerminalOutcomeConflict" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{jobId}/terminal-conflict/resolve:
    post:
      tags: [Jobs]
      summary: 保留中心端结果并确认冲突
      description: 仅允许交互式浏览器会话中的全局所有者访问。不会改写任务终态；确认写入审计后，通知匹配的 Agent 删除该条终态日志。相同幂等键和请求可安全重放。
      parameters:
        - { $ref: "#/components/parameters/JobID" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reported_fingerprint]
              properties:
                action: { type: string, const: keep_control }
                reported_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: 冲突已持久确认；Agent 离线时会在下一次重放后收到确认
          content:
            application/json:
              schema:
                type: object
                required: [conflict, idempotent_replay, acknowledgement_delivered]
                properties:
                  conflict: { $ref: "#/components/schemas/TerminalOutcomeConflict" }
                  idempotent_replay: { type: boolean }
                  acknowledgement_delivered: { type: boolean }
        "409": { $ref: "#/components/responses/Conflict" }

  /metrics:
    get:
      tags: [Monitoring]
      summary: 查询节点或实例指标
      description: 必须提供 node_id 或 instance_id。默认/最大窗口分别为 raw 1h/24h、1m 24h/31d、1h 30d/366d。
      parameters:
        - { name: node_id, in: query, schema: { type: string, format: uuid } }
        - {
            name: instance_id,
            in: query,
            schema: { type: string, format: uuid },
          }
        - {
            name: resolution,
            in: query,
            schema: { type: string, enum: [raw, 1m, 1h], default: 1m },
          }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: 最多 10000 个指标点
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /notifications:
    get:
      tags: [Notifications]
      summary: 列出有权读取的站内通知
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses:
        "200":
          description: 通知列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/NotificationView" },
                    }

  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: 将一条可见通知标记为已读
      parameters:
        - { $ref: "#/components/parameters/NotificationID" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "204": { description: 已标记 }
        "404": { $ref: "#/components/responses/NotFound" }

  /notification-channels:
    get:
      tags: [Notifications]
      summary: 列出 SMTP/Webhook 渠道
      description: 需要全局 manage；只返回 has_secret，不返回秘密。
      responses:
        "200":
          description: 渠道列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items:
                        { $ref: "#/components/schemas/NotificationChannel" },
                    }
    post:
      tags: [Notifications]
      summary: 创建 SMTP 或 Webhook 渠道
      description: SMTP 强制 STARTTLS；Webhook 必须是 HTTPS 且秘密至少 16 字符，并禁止重定向、代理及私网/本地/CGNAT 目标。
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CreateNotificationChannelRequest" }
      responses:
        "201":
          description: 渠道已创建，secret 不会返回
          content:
            application/json:
              schema:
                type: object
                required: [channel]
                properties:
                  channel: { $ref: "#/components/schemas/NotificationChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /notification-channels/{channelId}:
    delete:
      tags: [Notifications]
      summary: 软删除渠道并跳过待发送投递
      parameters:
        - { $ref: "#/components/parameters/ChannelID" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }

  /notification-deliveries:
    get:
      tags: [Notifications]
      summary: 列出外部投递状态
      description: 需要全局 manage。
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses:
        "200":
          description: 投递列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items:
                        { $ref: "#/components/schemas/NotificationDelivery" },
                    }

  /notification-deliveries/{deliveryId}/attempts:
    get:
      tags: [Notifications]
      summary: 列出一次投递的全部尝试
      parameters: [{ $ref: "#/components/parameters/DeliveryID" }]
      responses:
        "200":
          description: 尝试记录
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items:
                        {
                          $ref: "#/components/schemas/NotificationDeliveryAttempt",
                        },
                    }
        "404": { $ref: "#/components/responses/NotFound" }

  /notification-deliveries/{deliveryId}/retry:
    post:
      tags: [Notifications]
      summary: 手工重新排队 failed/pending 投递
      parameters:
        - { $ref: "#/components/parameters/DeliveryID" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "202": { description: 已重新排队；无响应正文 }
        "404": { $ref: "#/components/responses/NotFound" }

  /users:
    get:
      tags: [Users]
      summary: 列出团队成员和角色绑定
      description: 仅交互式全局所有者会话（root_security）；包含禁用账号，不含密码或秘密。所有者 API Token 也不能调用。
      x-interactive-session: true
      responses:
        "200":
          description: 成员列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/User" },
                    }
    post:
      tags: [Users]
      summary: 创建团队成员
      description: 仅交互式全局所有者会话（root_security）；`role` 创建一个全局绑定，也可用 role_bindings。账号以待激活状态创建，响应中的一次性密码仅返回一次。所有者 API Token 也不能调用。
      x-interactive-session: true
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: 用户已创建，一次性密码仅在此响应返回
          content:
            application/json:
              schema:
                type: object
                required: [user, one_time_password, expires_at]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  one_time_password:
                    { type: string, pattern: "^l4d2p_once_[A-Za-z0-9_-]{32}$", writeOnly: true }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{userId}:
    delete:
      tags: [Users]
      summary: 永久删除团队账号
      description: |
        仅交互式全局所有者会话（root_security），所有者 API Token 不能调用。
        禁止删除当前登录账号或首启根所有者。物理删除账号及其会话、API Token、
        TOTP 恢复码、激活凭据和权限绑定；保留游戏资源、任务和历史审计姓名。
        无请求正文。删除不存在的用户也返回 204，因此重复请求（包括相同 Idempotency-Key）不会重复删除或写入删除审计。
      x-interactive-session: true
      parameters:
        - { $ref: "#/components/parameters/UserID" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "204": { description: 账号已删除或已不存在 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    patch:
      tags: [Users]
      summary: 修改成员、重置密码、禁用或替换全部绑定
      description: |
        仅交互式全局所有者会话（root_security），所有者 API Token 也不能调用。`role` 和 `role_bindings`
        互斥；密码、禁用或绑定变化会撤销目标用户所有会话和 API Token；当前账号不能禁用自己。待激活账号不能由管理员直接设置正式密码，应改用一次性密码重新签发端点。
      x-interactive-session: true
      parameters:
        - { $ref: "#/components/parameters/UserID" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: 用户已修改
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{userId}/role-bindings:
    get:
      tags: [Users]
      summary: 列出成员的全局、节点和实例绑定
      description: 仅交互式全局所有者会话（root_security）；所有者 API Token 也不能调用。
      x-interactive-session: true
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "200":
          description: 角色绑定
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/RoleBinding" },
                    }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/activation:
    post:
      tags: [Users]
      summary: 为待激活账号重新生成一次性密码
      description: 仅交互式全局所有者会话（root_security）；旧密码和已有激活会话立即失效，明文只在本次响应返回。正常账号不能重新签发。
      x-interactive-session: true
      parameters:
        - { $ref: "#/components/parameters/UserID" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "201":
          description: 新的一次性密码已签发
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserActivationCredential" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /audit:
    get:
      tags: [Audit]
      summary: 查询不可编辑审计事件
      description: |
        `audit.read_global` 可独立读取全部审计事件、来源地址，也可按任意 `resource_id` 过滤；不隐含
        `audit.read`。普通 `audit.read` 只返回调用者获准资源的事件且隐藏 `remote_ip`；全局绑定中的
        `audit.read` 不能替代 `audit.read_global` 读取全局聚合。
      parameters:
        - { name: resource_id, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, default: 100, maximum: 500 },
          }
      responses:
        "200":
          description: 审计事件，按时间倒序
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/AuditEvent" },
                    }
        "403": { $ref: "#/components/responses/Forbidden" }

  /system/updates:
    get:
      tags: [System]
      summary: 查询中心端升级能力和历史
      description: 仅全局所有者的交互式会话可用；支持 Windows x64 便携部署和显式启用 Docker Socket 升级的 Compose 部署。
      x-interactive-session: true
      responses:
        "200":
          description: 当前版本、活动升级和最近历史
          content:
            application/json:
              schema:
                type: object
                required: [supported, current_version, history]
                properties:
                  supported: { type: boolean }
                  current_version: { type: string }
                  deployment: { type: string, enum: [windows-portable, docker-compose] }
                  package_format: { type: string, enum: [zip, tar.gz] }
                  max_package_bytes: { type: integer, minimum: 1 }
                  reason: { type: string }
                  active: { $ref: "#/components/schemas/SystemUpdate" }
                  history: { type: array, items: { $ref: "#/components/schemas/SystemUpdate" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [System]
      summary: 上传部署对应的升级包并启动中心端升级
      x-interactive-session: true
      description: |
        仅全局所有者交互式会话可用，要求 CSRF 与非空 Idempotency-Key。Windows ZIP 最大 512 MiB；
        Docker 镜像 .tar.gz 最大 1 GiB。校验未签名清单/OCI 内容、产品、架构、版本、文件大小与 SHA-256。
        正式版本允许同版本重装和向上升级，禁止降级或切回开发标签；Docker 和 Windows 便携开发构建允许替换为其他开发构建或正式版本。
        服务会短暂离线；失败时独立升级工作器恢复旧程序或镜像、
        SQLite 和 Docker 主密钥快照。Docker 模式需要向 Control 挂载 /var/run/docker.sock，等同授予宿主机 root 级能力。
      parameters:
        - { $ref: "#/components/parameters/RequiredIdempotencyKey" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [package]
              properties:
                package: { type: string, format: binary }
      responses:
        "202":
          description: 升级任务已启动
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status, phase]
                properties:
                  job_id: { type: string, format: uuid }
                  status: { type: string, enum: [queued, running] }
                  phase: { type: string }
                  target_version: { type: string }
                  idempotent_replay: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /system/updates/{jobId}:
    get:
      tags: [System]
      summary: 查询中心端升级状态
      x-interactive-session: true
      parameters:
        - { $ref: "#/components/parameters/JobID" }
      responses:
        "200":
          description: 可跨服务重启读取的升级状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemUpdate" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/servers:
    get:
      tags: [Public]
      security: []
      summary: 列出显式公开实例的脱敏状态
      responses:
        "200":
          description: 不包含玩家身份、节点路径、封禁或 RCON 数据
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/PublicServer" },
                    }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: l4d2panel_session
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: l4d2p_<secret>

  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: false
      description: Cookie 会话的写请求必需；Bearer API Token 调用时省略。
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 200 }
      description: |
        相同用户和键仅在资源、操作、正文及版本等规范化请求完全一致时重放已有任务；不同请求或旧版无请求指纹的任务返回 409。
        空值表示不启用 HTTP 幂等映射。Control 在秘密加密前用部署主密钥计算 HMAC-SHA256 指纹，数据库不保存明文请求身份。
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
      description: 本操作必须提供；相同用户、键、目标和完整规范化分块请求只重放原任务，否则返回 409。
    IfMatchSHA256:
      name: If-Match
      in: header
      required: false
      schema: { type: string, pattern: '^"?[A-Fa-f0-9]{64}"?$' }
      description: 当前文件 SHA-256；不是实例配置版本。
    NodeID:
      {
        name: nodeId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    QuarantineEntryID:
      {
        name: entryId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    InstanceID:
      {
        name: instanceId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    MapID:
      {
        name: mapId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    JobID:
      {
        name: jobId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    PackageID:
      {
        name: packageId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    PackageVersionID:
      {
        name: versionId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    BackupID:
      {
        name: backupId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    BackupUploadID:
      {
        name: uploadId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    ScheduleID:
      {
        name: scheduleId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    NotificationID:
      {
        name: notificationId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    ChannelID:
      {
        name: channelId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    DeliveryID:
      {
        name: deliveryId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    UserID:
      {
        name: userId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    TokenID:
      {
        name: tokenId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    FilePath:
      name: path
      in: query
      required: true
      schema: { type: string }
      description: 位于 cfg/addons/logs 白名单内的相对路径；旧版可能含密码的 l4d2panel.cfg 继续禁止读取或修改。

  headers:
    ChunkSHA256:
      {
        description: 本块 SHA-256,
        schema: { type: string, pattern: "^[a-f0-9]{64}$" },
      }
    FileSHA256:
      {
        description: 完整文件 SHA-256,
        schema: { type: string, pattern: "^[a-f0-9]{64}$" },
      }
    NextOffset:
      { description: 下一块 offset, schema: { type: integer, format: int64 } }
    TransferEOF: { description: 是否到达文件末尾, schema: { type: boolean } }

  responses:
    BadRequest:
      description: 请求字段或 JSON 无效
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    Unauthorized:
      description: 未认证或凭据已过期/撤销
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    Forbidden:
      description: 权限、资源范围、CSRF 或交互式会话要求不满足
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    NotFound:
      description: 资源不存在或不在调用者可见范围
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    Conflict:
      description: >-
        版本、端口、任务锁、状态或传输源发生冲突。实例操作或配置修改因实例写锁被拒绝时，
        code 仍为 conflict，message 包含阻塞任务 ID 及执行中、等待节点确认取消或结果尚未同步的说明；
        不包含阻塞任务的参数或结果。已结束任务的待同步记录由中心端启动及后台维护主动重试，
        活动任务和取消待确认任务不会被自动强制解锁。
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    Gone:
      description: 消费式日志/下载正文已读取
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    RateLimited:
      description: 登录尝试过多；响应含 Retry-After
      headers:
        Retry-After: { schema: { type: integer }, description: 重试等待秒数 }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    RangeNotSatisfiable:
      description: offset 超过备份大小
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    TransferPending:
      description: "传输任务尚未完成；响应含 Retry-After: 1"
      headers:
        Retry-After: { schema: { type: integer, const: 1 } }
      content:
        application/json:
          schema:
            type: object
            required: [job_id, status, progress]
            properties:
              job_id: { type: string, format: uuid }
              status: { $ref: "#/components/schemas/JobStatus" }
              progress: { type: integer, minimum: 0, maximum: 100 }
    BinaryChunk:
      description: 一个已校验的消费式分块
      headers:
        X-Chunk-SHA256: { $ref: "#/components/headers/ChunkSHA256" }
        X-File-SHA256: { $ref: "#/components/headers/FileSHA256" }
        X-Next-Offset: { $ref: "#/components/headers/NextOffset" }
        X-Transfer-EOF: { $ref: "#/components/headers/TransferEOF" }
        ETag: { schema: { type: string } }
        Content-Range: { schema: { type: string } }
      content:
        application/octet-stream:
          schema: { type: string, format: binary, maxLength: 1048576 }

  schemas:
    SystemUpdate:
      type: object
      required: [job_id, status, phase, current_version, created_at, updated_at]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        phase: { type: string, enum: [validating, stopping, backing_up, installing, migrating, starting, health_check, rolling_back] }
        current_version: { type: string }
        target_version: { type: string }
        package_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        upload_bytes: { type: integer, minimum: 1, maximum: 1073741824 }
        rollback: { type: string, enum: [not_required, succeeded, failed] }
        error: { type: string, maxLength: 500, description: 脱敏的阶段错误；容器升级失败时可含目标容器退出状态及有界尾部日志 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            reason: { type: string, enum: [instance_busy], description: "仅实例写锁占用时返回；请求未创建任务，可使用原幂等键和原正文有界重试。其他 conflict 不可自动重试。" }
            blocking_job_id: { type: string, description: "instance_busy 对应的阻塞任务 ID，不授予该任务的详情读取权限。" }

    BootstrapStatus:
      type: object
      required: [required, key_configured]
      properties:
        required: { type: boolean }
        key_configured:
          type: boolean
          description: 表示本机是否已经签发初始化密钥；初始化完成后固定为 false。
        csrf_token:
          type: string
          description: 仅在 required=true 时返回，且只能与配套引导 Cookie 一起使用。

    BootstrapOwnerRequest:
      type: object
      required: [setup_key]
      properties:
        setup_key:
          { type: string, minLength: 55, maxLength: 55, writeOnly: true, pattern: "^l4d2p_setup_[A-Za-z0-9_-]{43}$" }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password:
          { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
        totp_code: { type: string, pattern: "^[0-9]{6}$", writeOnly: true }
        recovery_code:
          type: string
          pattern: "^[A-Za-z2-7 -]{16,25}$"
          writeOnly: true
          description: 与 totp_code 互斥；连字符和空格会被忽略，每个码只能使用一次。

    CompleteActivationRequest:
      type: object
      required: [new_password]
      properties:
        new_password: { type: string, minLength: 12, maxLength: 1024, writeOnly: true }

    AuthResponse:
      type: object
      required: [user, csrf_token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrf_token: { type: string }
        api_token: { type: boolean, default: false }
        password_change_required:
          type: boolean
          default: false
          description: true 表示当前是受限激活会话，客户端必须立即引导设置新密码。

    Role:
      type: string
      enum: [owner, admin, operator, viewer]
      description: 权限预设名称；角色绑定的 permissions 才是最终授权集合。操作员预设包含全部地图权限并保留观察者读取权限，但默认不含玩家踢出/封禁/解除封禁、聊天广播、任意 RCON、文件内容操作、备份操作或计划任务管理。
    PermissionScope: { type: string, enum: [read, operate, manage] }
    BindingPermission:
      type: string
      enum:
        [nodes.read, nodes.enroll, nodes.update, nodes.credentials.rotate, nodes.discover, nodes.quarantine.read, nodes.quarantine.purge, nodes.delete,
         environments.read, environments.manage, instances.read, instances.create, instances.configure, instances.delete, instances.start, instances.stop,
         instances.restart, players.read, players.kick, players.ban, players.unban, players.change_map,
         players.broadcast, rcon.execute, files.list, files.read, files.write, files.delete, packages.read, packages.install,
         packages.toggle, packages.delete, packages.rollback, backups.read, backups.download, backups.create, backups.restore, backups.delete, schedules.read, schedules.manage,
         logs.read, maps.read, maps.import, maps.assign, maps.verify, maps.delete, jobs.read, jobs.details, jobs.cancel, audit.read,
         audit.read_global, notifications.read, notifications.manage, metrics.read, root_security]

    RoleBindingInput:
      type: object
      required: [role, scope_type]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/BindingPermission" }
          description: 具体授权集合；只有字段省略时才由 role 预设按 scope_type 填充，显式 null 或空数组会被拒绝。
        scope_type: { type: string, enum: [global, node, instance] }
        node_id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
      description: |
        global 不带资源 ID；node 只带 node_id；instance 只带 instance_id；owner 仅允许 global 且权限不可自定义。
        节点/实例非查看权限分别要求同一绑定包含 `nodes.read`/`instances.read`；其他读取与操作权限保持可独立授予。
        `players.broadcast` 与 `rcon.execute` 独立。创建计划另需计划动作权限。实例绑定可获得所在节点的共享地图 read/import/verify/delete 权限，其中 delete 仅限当前账号导入的地图；地图分配另需目标实例的 `maps.assign`。

    RoleBinding:
      allOf:
        - { $ref: "#/components/schemas/RoleBindingInput" }
        - type: object
          required: [id, user_id, permissions, created_at]
          properties:
            id: { type: string, format: uuid }
            user_id: { type: string, format: uuid }
            created_by: { type: string, format: uuid }
            created_at: { type: string, format: date-time }

    User:
      type: object
      required:
        [id, username, display_name, role, totp_enabled, disabled, account_state, role_bindings, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        totp_enabled: { type: boolean }
        disabled: { type: boolean }
        bootstrap_owner: { type: boolean, readOnly: true }
        account_state: { type: string, enum: [pending_activation, active], readOnly: true }
        role_bindings:
          { type: array, items: { $ref: "#/components/schemas/RoleBinding" } }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }

    CreateUserRequest:
      type: object
      required: [username]
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        display_name: { type: string, maxLength: 128 }
        role: { $ref: "#/components/schemas/Role" }
        role_bindings:
          {
            type: array,
            minItems: 1,
            maxItems: 500,
            items: { $ref: "#/components/schemas/RoleBindingInput" },
          }
      description: role 或 role_bindings 至少提供一个；同时提供时 role_bindings 优先。

    UserActivationCredential:
      type: object
      required: [one_time_password, expires_at]
      properties:
        one_time_password:
          { type: string, pattern: "^l4d2p_once_[A-Za-z0-9_-]{32}$", writeOnly: true }
        expires_at: { type: string, format: date-time }

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 128 }
        password:
          { type: string, minLength: 12, maxLength: 1024, writeOnly: true }
        disabled: { type: boolean }
        role: { $ref: "#/components/schemas/Role" }
        role_bindings:
          {
            type: array,
            minItems: 1,
            maxItems: 500,
            items: { $ref: "#/components/schemas/RoleBindingInput" },
          }

    APIToken:
      type: object
      required: [id, user_id, name, scopes, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        scopes:
          {
            type: array,
            minItems: 1,
            maxItems: 3,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/PermissionScope" },
          }
        node_id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    CreateAPITokenRequest:
      type: object
      required: [name, scopes, expires_at]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          {
            type: array,
            minItems: 1,
            maxItems: 3,
            items: { $ref: "#/components/schemas/PermissionScope" },
          }
        node_id: { type: string, format: uuid }
        instance_id:
          {
            type: string,
            format: uuid,
            description: 若同时给 node_id，实例必须属于该节点,
          }
        expires_at: { type: string, format: date-time }

    AgentEnrollRequest:
      type: object
      required: [token, name, instance_root]
      properties:
        token: { type: string, writeOnly: true }
        name: { type: string, description: Agent 报告的兼容回退名称；仅当注册令牌未保存显示名称时使用 }
        os: { type: string }
        arch: { type: string }
        agent_version: { type: string }
        instance_root: { type: string }

    Node:
      type: object
      required:
        [
          id,
          name,
          status,
          os,
          arch,
          agent_version,
          cpu_percent,
          memory_used,
          memory_total,
          disk_used,
          disk_total,
          network_rx,
          network_tx,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [pending, online, offline, revoked] }
        os: { type: string }
        arch: { type: string }
        agent_version: { type: string }
        address: { type: string, description: Agent 最近来源地址；受权限保护 }
        public_address: { type: string }
        instance_root:
          { type: string, description: Agent 报告的首个实例根；受权限保护 }
        cpu_percent: { type: number }
        memory_used: { type: integer, format: int64 }
        memory_total: { type: integer, format: int64 }
        disk_used: { type: integer, format: int64 }
        disk_total: { type: integer, format: int64 }
        network_rx: { type: integer, format: int64, minimum: 0, readOnly: true, description: Agent 最新节点级采样中的累计接收字节数。 }
        network_tx: { type: integer, format: int64, minimum: 0, readOnly: true, description: Agent 最新节点级采样中的累计发送字节数。 }
        last_seen_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    RuntimeEnvironment:
      type: object
      required: [id, node_id, node_status, agent_supported, system_dependencies, steamcmd_source, steamcmd_status, created_at, updated_at]
      properties:
        id: { type: string }
        node_id: { type: string, format: uuid }
        node_name: { type: string }
        node_status: { type: string, enum: [pending, online, offline, revoked] }
        agent_supported: { type: boolean }
        system_dependencies: { type: object, additionalProperties: true }
        steamcmd_source: { type: string, enum: [unconfigured, managed, custom] }
        steamcmd_path: { type: string }
        steamcmd_status: { type: string, enum: [unconfigured, checking, ready, error] }
        steamcmd_version: { type: string }
        last_error: { type: string }
        last_inspected_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GameInstallation:
      type: object
      required: [id, environment_id, node_id, path, app_id, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        environment_id: { type: string }
        node_id: { type: string, format: uuid }
        path: { type: string, description: 节点主机绝对路径 }
        app_id: { type: integer, const: 222860 }
        status: { type: string, enum: [pending, installing, validating, updating, ready, degraded] }
        build_id: { type: string }
        last_error: { type: string }
        bound_instance_id: { type: string, format: uuid }
        last_checked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    QuarantineEntry:
      type: object
      description: 隔离条目的安全 Control 元数据；不包含节点绝对路径。
      required:
        [
          id,
          node_id,
          source_job_id,
          original_instance_id,
          instance_name,
          root_index,
          entry_name,
          quarantined_at,
          retention_expires_at,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        source_job_id: { type: string, format: uuid }
        original_instance_id: { type: string, format: uuid }
        instance_name: { type: string, minLength: 1, maxLength: 200 }
        root_index: { type: integer, minimum: 0 }
        entry_name:
          type: string
          maxLength: 200
          pattern: "^[A-Za-z0-9._-]+-[0-9]{8}T[0-9]{6}Z$"
          description: "`.quarantine` 下的直属 basename，不是路径。"
        quarantined_at: { type: string, format: date-time }
        retention_expires_at:
          {
            type: string,
            format: date-time,
            description: 七天强制保留期结束时间；到期不代表自动删除。,
          }
        purge_job_id: { type: string, format: uuid }
        purged_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    QuarantinePurgeConfirmation:
      type: object
      required: [confirmation_token, expires_at]
      properties:
        confirmation_token:
          {
            type: string,
            pattern: "^qpc_",
            writeOnly: true,
            description: 五分钟有效且只返回一次。,
          }
        expires_at: { type: string, format: date-time }

    QuarantinePurgeRequest:
      type: object
      required: [confirmation_token]
      additionalProperties: false
      properties:
        confirmation_token: { type: string, pattern: "^qpc_", writeOnly: true }

    DiscoveryRequest:
      type: object
      properties:
        max_depth: { type: integer, minimum: 1, maximum: 8, default: 6 }
        max_entries:
          {
            type: integer,
            minimum: 1,
            maximum: 20000,
            default: 5000,
            description: 整次扫描最多读取的目录条目数,
          }

    InstallationCandidate:
      type: object
      required:
        [
          root_index,
          path,
          name,
          executable,
          has_gameinfo,
          has_appmanifest,
          managed,
          likely_running,
          evidence,
        ]
      properties:
        root_index: { type: integer, minimum: 0 }
        path: { type: string, description: 所选实例根内使用斜杠的相对路径 }
        name: { type: string }
        executable: { type: string, enum: [srcds.exe, srcds_run, srcds_linux] }
        has_gameinfo: { type: boolean }
        has_appmanifest: { type: boolean }
        managed: { type: boolean, description: 该目录是否已在本 Agent 注册表中 }
        likely_running:
          {
            type: boolean,
            description: 是否发现可执行路径属于该目录的活动 srcds 进程,
          }
        pid:
          {
            type: integer,
            format: int32,
            minimum: 1,
            description: 仅 likely_running=true 时返回；受认证和权限保护,
          }
        evidence: { type: array, items: { type: string } }

    DiscoveryResult:
      type: object
      required: [candidates, scanned_directories, skipped_links, truncated]
      properties:
        candidates:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/InstallationCandidate" }
        scanned_directories: { type: integer, minimum: 0 }
        skipped_links: { type: integer, minimum: 0 }
        truncated:
          { type: boolean, description: 达到目录或候选数量上限时为 true }

    DiscoveryJob:
      allOf:
        - { $ref: "#/components/schemas/Job" }
        - type: object
          properties:
            type: { type: string, const: discover_instances }
            result:
              oneOf:
                - { $ref: "#/components/schemas/DiscoveryResult" }
                - {
                    type: object,
                    maxProperties: 0,
                    description: 任务未完成时的空结果,
                  }

    InstanceConfig:
      type: object
      properties:
        hostname:
          {
            type: string,
            maxLength: 256,
            pattern: '^[^\u0000\r\n]*$',
            description: Control 另按 UTF-8 字节限制为 256。,
          }
        mode: { type: string, pattern: "^[A-Za-z0-9_-]*$" }
        difficulty:
          {
            type: string,
            pattern: "^(|[Ee][Aa][Ss][Yy]|[Nn][Oo][Rr][Mm][Aa][Ll]|[Hh][Aa][Rr][Dd]|[Ii][Mm][Pp][Oo][Ss][Ss][Ii][Bb][Ll][Ee])$",
          }
        max_players:
          {
            type: integer,
            minimum: 0,
            maximum: 32,
            description: 0 使用默认值，否则为 1–32。,
          }
        start_map: { type: string, pattern: "^[A-Za-z0-9_-]*$" }
        steam_group_id: { type: string, pattern: "^[0-9]{0,20}$" }
        public_status: { type: boolean }
        extra_args:
          type: array
          maxItems: 128
          description: 每项不能为空且不得含 NUL、CR/LF 或分号；托管参数、`-basedir` 与 `-defaultgamedir` 会返回 invalid_config。`-tickrate` 可出现一次，后面必须是 1–1000 的整数值。
          items:
            {
              type: string,
              minLength: 1,
              maxLength: 4096,
              pattern: '^[^\u0000\r\n;]+$',
            }
        cvars:
          type: object
          maxProperties: 256
          propertyNames: { pattern: "^[A-Za-z0-9_-]+$" }
          additionalProperties:
            { type: string, maxLength: 4096, pattern: '^[^\u0000\r\n]*$' }
          description: CVar 名不得带首尾空白；`rcon_password` 与 `sv_password`（不区分大小写）被拒绝。游戏 CVar 应直接维护在 server.cfg；值由 Control 另按 UTF-8 字节限制为 4096。
        auto_restart: { type: boolean }
      description: Control 在持久化前执行这些约束；危险或与面板托管值冲突的高级参数直接返回 400 invalid_config，`-tickrate` 按唯一的 1–1000 整数参数校验，Agent 派发后仍会再次校验。为兼容旧客户端，请求中旧版 `server_password` 与 `region` 字段会被忽略且不会持久化。

    MapArtifact:
      type: object
      required: [id, ordinal, sha256, size]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        size: { type: integer, format: int64, minimum: 1 }

    MapBSP:
      type: object
      required: [virtual_path, dictionary_present]
      properties:
        virtual_path: { type: string, pattern: '^maps/.+\.bsp$' }
        start_name: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
        dictionary_present: { type: boolean }

    MapChapter:
      type: object
      required: [ordinal, bsp_name, display_name]
      properties:
        ordinal: { type: integer, minimum: 1, maximum: 4096 }
        bsp_name: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
        display_name: { type: string, minLength: 1, maxLength: 255 }
        image: { type: string, maxLength: 512 }

    MapMode:
      type: object
      required: [name, chapters]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
        chapters: { type: array, minItems: 1, maxItems: 4096, items: { $ref: "#/components/schemas/MapChapter" } }

    MapWarning:
      type: object
      required: [code, message]
      properties:
        code: { type: string, maxLength: 64 }
        message: { type: string, maxLength: 1024 }
        virtual_path: { type: string, maxLength: 512 }

    MapImportFailure:
      type: object
      required: [stage, code, summary, remediation, retryable]
      properties:
        stage: { type: string, enum: [preflight, staging, metadata, download, archive, vpk, publish] }
        code: { type: string, maxLength: 64 }
        summary: { type: string, maxLength: 256 }
        remediation: { type: string, maxLength: 1024 }
        retryable: { type: boolean }
        source: { type: string, maxLength: 512, description: 已脱敏且截断的分享内相对来源名；不包含分享 URL 或节点绝对路径。 }

    MapReplica:
      type: object
      required: [filesystem_id, health]
      properties:
        filesystem_id: { type: string, description: 不透明卷身份；不是节点绝对路径。 }
        health: { type: string, enum: [healthy, missing, corrupt] }
        verified_at: { type: [string, "null"], format: date-time }

    MapAssignment:
      type: object
      required: [map_id, instance_id, restart_required, created_at, updated_at]
      properties:
        map_id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        restart_required: { type: boolean, deprecated: true, description: 新分配固定为 false；保留字段用于兼容旧数据。 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Map:
      type: object
      required: [id, node_id, name, health, aggregate_sha256, total_size, source_type, removed_files, removed_bytes, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 255 }
        author: { type: string, maxLength: 255 }
        version: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 2048 }
        poster_url: { type: string, pattern: '^/api/v1/maps/[0-9a-f-]+/poster$' }
        health: { type: string, enum: [healthy, degraded, broken, deleting] }
        aggregate_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        total_size: { type: integer, format: int64, minimum: 1 }
        source_type: { type: string, const: qq_flash }
        source_name: { type: string, maxLength: 255 }
        removed_files: { type: integer, minimum: 0 }
        removed_bytes: { type: integer, format: int64, minimum: 0 }
        artifacts: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/MapArtifact" } }
        bsps: { type: array, maxItems: 4096, items: { $ref: "#/components/schemas/MapBSP" } }
        modes: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/MapMode" } }
        warnings: { type: array, maxItems: 4096, items: { $ref: "#/components/schemas/MapWarning" } }
        replicas: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/MapReplica" } }
        assignments: { type: array, maxItems: 10000, items: { $ref: "#/components/schemas/MapAssignment" } }
        created_by: { type: string, format: uuid, description: 导入地图的账号 ID；账号删除后省略。 }
        created_by_display_name: { type: string, maxLength: 128, description: 上传者当前显示名称；不包含用户名，账号删除后省略。 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Instance:
      type: object
      required:
        [
          id,
          node_id,
          node_name,
          node_status,
          name,
          status,
          host,
          port,
          players,
          max_players,
          update_available,
          version,
          rcon_configured,
          config,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        node_name:
          type: string
          readOnly: true
          description: 所属节点的当前名称。
        node_status:
          type: string
          enum: [pending, online, offline, revoked]
          readOnly: true
          description: 所属节点的当前连接状态；节点离线时实例仍保留在响应中，实例 status 表示最后确认的进程生命周期状态。
        game_installation_id: { type: string, format: uuid, description: 独占绑定的游戏安装 }
        node_public_address:
          type: string
          readOnly: true
          description: 所属节点显式配置的公开连接地址；仅为 public_address 投影，不包含 Agent 来源地址、节点路径、scheme、URL 路径或端口。
        name: { type: string }
        status:
          {
            type: string,
            enum:
              [
                installing,
                stopped,
                starting,
                running,
                stopping,
                updating,
                degraded,
                external,
              ],
          }
        path: { type: string, readOnly: true }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        tv_port: { type: integer, minimum: 0, maximum: 65535 }
        pid: { type: integer, readOnly: true }
        map: { type: string }
        mode: { type: string }
        players: { type: integer }
        max_players: { type: integer }
        build_id: { type: string }
        update_available: { type: boolean, readOnly: true, deprecated: true, description: 兼容字段；系统不再后台探测，维护结果请查看运行环境。 }
        available_build: { type: string, readOnly: true, deprecated: true }
        last_update_checked_at: { type: [string, "null"], format: date-time, readOnly: true, deprecated: true }
        version: { type: integer, minimum: 1, readOnly: true, description: 当前结构化配置的乐观并发修订号；不表示存在可回滚历史。 }
        rcon_configured:
          type: boolean
          readOnly: true
          description: 中心端是否保存了非空 RCON 连接凭据；不会返回密码或密文。false 不代表游戏进程异常。
        config: { $ref: "#/components/schemas/InstanceConfig" }
        started_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateInstanceRequest:
      type: object
      required: [node_id, name, config]
      oneOf:
        - required: [game_installation_id]
        - required: [operation, path]
      properties:
        node_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 128 }
        game_installation_id: { type: string, format: uuid, description: 所选节点上已就绪且未绑定的游戏安装 }
        operation: { type: string, const: import, description: 提交 path 时显式选择节点现有目录导入。 }
        path: { type: string, minLength: 1, maxLength: 1024, description: 待导入的节点 Windows 盘符绝对路径或 Linux 绝对路径。 }
        executable: { type: string, enum: [srcds.exe, srcds_run, srcds_linux], description: 可选的平台固定服务端文件名。 }
        host: { type: string, default: 0.0.0.0 }
        port:
          {
            type: integer,
            minimum: 0,
            maximum: 65535,
            default: 0,
            description: 0 表示在 27015–27999 自动分配,
          }
        tv_port:
          {
            type: integer,
            minimum: 0,
            maximum: 65535,
            default: 0,
            description: 0 表示禁用；非零值与同节点所有游戏/SourceTV 端口互斥,
          }
        rcon_password:
          {
            type: string,
            maxLength: 256,
            pattern: '^[^\u0000\r\n]*$',
            writeOnly: true,
            description: 可留空；仅作为中心端连接凭据加密保存，必须与 server.cfg 中的 rcon_password 一致。,
          }
        config: { $ref: "#/components/schemas/InstanceConfig" }

    PatchInstanceRequest:
      type: object
      required: [version]
      properties:
        name: { type: string, maxLength: 128 }
        config: { $ref: "#/components/schemas/InstanceConfig" }
        port:
          {
            type: integer,
            minimum: 1,
            maximum: 65535,
            description: 仅停止实例可修改；必须与 SourceTV 端口不同并且未被同节点其他实例或待变更任务预留。,
          }
        rcon_password:
          {
            type: string,
            maxLength: 256,
            pattern: '^[^\u0000\r\n]*$',
            writeOnly: true,
            description: 空字符串清除中心端 RCON 凭据；Control 另按 UTF-8 字节限制为 256，明文不会回显或写入游戏文件。,
          }
        version:
          {
            type: integer,
            minimum: 1,
            description: 当前 Instance.version；位于 JSON 正文,
          }

    InstanceActionType:
      type: string
      enum:
        - backup
        - ban_player
        - broadcast
        - change_map
        - create_schedule
        - install_package
        - kick_player
        - rcon
        - restart
        - restore
        - start
        - stop
        - toggle_package
        - unban_player

    DirectInstanceActionType:
      allOf:
        - { $ref: "#/components/schemas/InstanceActionType" }
      description: 通用动作端点支持的公开动作；内部 Agent 任务类型不在此枚举中。

    SchedulableInstanceActionType:
      type: string
      enum: [start, stop, restart, backup, broadcast]
      description: 计划任务只允许不含秘密的生命周期、备份和安全广播动作。

    InstanceActionRequest:
      type: object
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/DirectInstanceActionType" }
        payload: { $ref: "#/components/schemas/InstanceActionPayload" }

    InstanceActionPayload:
      type: object
      additionalProperties: true
      description: |
        动作特定参数；秘密字段会在持久化前加密或脱敏。玩家动作约定：
        `kick_player` 传 name；`ban_player` 传 steam_id、可选 duration_minutes（0–525600，0 为永久）
        和最多 200 字符单行 reason；`unban_player` 传 steam_id。常用动作约定：
        `rcon` 传 command；`broadcast` 传 message；`change_map` 传 map；`backup` 可传 kind、
        retention_daily、retention_weekly；`restore` 推荐传 backup_id，其内部归档定位符会加密持久化，server.cfg 作为普通可移植配置恢复，中心端 RCON 凭据不会写入文件；`toggle_package` 传 package_id 和布尔 enabled，enabled=false 只允许实例处于 stopped 状态，Control 与 Agent 都会拒绝运行中停用；
        `install_package` 传 kind，以及 source、source_id 或 name + content_base64（原始文件最大 100 MiB）。
        插件类型可传 source_transport=qq_flash 和 source 分享链接，分享必须恰好包含一个实际包文件；
        kind=smart 仅接受已经识别的本机或 QQ 闪传 ZIP/7Z/RAR，还必须传 inspection_fingerprint、smart_packages
        以及与识别时相同的 path_encoding；
        每个选择项含 folder_id、可选 package_id（同名已纳管智能插件更新）、歧义路径 overrides 和已有未纳管文件 takeovers；
        takeovers 表示彻底接管并覆盖，安装成功后不保留旧文件，卸载插件时会删除接管文件而不恢复旧内容。
        运行中安装或启用智能插件必须同时传 acknowledge_live_changes=true 与 acknowledge_restart_required=true；停用和删除必须先停服。
        安装 SourceMod（官方或第三方整包）前必须先成功安装并启用 Metamod:Source；已有的
        left4dead2/addons/sourcemod/configs/admins_simple.ini 不会被覆盖，首次安装创建的同名文件也会在后续更新和卸载中保留。
        VPK 安装、回退及 `toggle_package` 重新启用不会扫描其他 VPK，模组之间的覆盖由 L4D2 挂载顺序决定。Workshop 下载载荷不执行 VPK 内容格式校验，只核对普通文件、SHA-256 和安全写入。第三方原生包另传 acknowledge_native_risk=true；`stop` 可传 maintenance 和
        warning_seconds；`restart` 不接受维护广播参数，只接受 `running`、`degraded` 或 `external` 实例，停止状态返回 409；仅 external 实例的直接 restart 可选传一次性 existing_rcon_password，用于让旧进程优雅退出。
        广播使用 Agent 固定安全文案。`create_schedule` 传 name、cron、timezone、action、enabled 和嵌套 payload；
        仅允许 start/stop/restart/backup/broadcast。计划 broadcast 的 message 位于外层（为空时使用 name），
        其他计划动作只会从嵌套 payload 复制其动作白名单字段。
      properties:
        name: { type: string }
        command:
          { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
        message:
          {
            type: string,
            minLength: 1,
            maxLength: 200,
            description: 广播文本；计划广播还要求 UTF-8 正文不超过 256 字节,
          }
        map: { type: string }
        steam_id: { type: string }
        duration_minutes:
          { type: integer, minimum: 0, maximum: 525600, default: 0 }
        reason: { type: string, maxLength: 200 }
        kind: { type: string }
        inspection_fingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
        path_encoding:
          type: string
          enum: [auto, utf8, gbk, big5]
          default: auto
          description: 智能插件 ZIP 内部路径编码，识别和安装必须相同。
        smart_packages:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/SmartPluginSelection" }
        acknowledge_live_changes: { type: boolean }
        acknowledge_restart_required: { type: boolean }
        source: { type: string }
        source_transport: { type: string, enum: [qq_flash] }
        source_id: { type: string }
        content_base64:
          type: string
          contentEncoding: base64
          maxLength: 139810136
          writeOnly: true
          description: 本机上传包；Base64 解码后的原始文件最大 100 MiB，必须同时提供安全的文件名 name。
        acknowledge_native_risk: { type: boolean, default: false, description: 原生 DLL/SO 和第三方 SourceMod/Metamod 整包安装必须为 true }
        package_id: { type: string, format: uuid }
        enabled: { type: boolean }
        backup_id: { type: string, format: uuid }
        retention_daily: { type: integer, minimum: 1 }
        retention_weekly: { type: integer, minimum: 1 }
        maintenance: { type: boolean, default: false }
        warning_seconds:
          { type: array, items: { type: integer, minimum: 1, maximum: 3600 } }
        timeout_seconds: { type: integer, minimum: 1, maximum: 300 }
        existing_rcon_password:
          type: string
          writeOnly: true
          description: 仅 external 实例的直接 restart 可用；加密入任务，只用于旧进程 RCON quit，不替换中心端保存的 RCON 凭据。
        cron: { type: string }
        timezone: { type: string }
        action: { $ref: "#/components/schemas/SchedulableInstanceActionType" }
        payload: { $ref: "#/components/schemas/ScheduledInputPayload" }

    ScheduledInputPayload:
      type: object
      additionalProperties: false
      description: |
        按 action 仅使用对应字段：start 使用 health_timeout_seconds；stop 使用 timeout_seconds、maintenance、
        warning_seconds；restart 仅使用 timeout_seconds 和 health_timeout_seconds；backup 使用 kind 和保留数量。
        broadcast 的 message 位于 create_schedule 外层，不使用此对象。
      properties:
        timeout_seconds: { type: integer, minimum: 1, maximum: 300 }
        health_timeout_seconds: { type: integer, minimum: 1, maximum: 300 }
        maintenance: { type: boolean }
        warning_seconds:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: integer, minimum: 1, maximum: 3600 }
        kind: { type: string, enum: [daily, weekly] }
        retention_daily: { type: integer, minimum: 1, maximum: 365 }
        retention_weekly: { type: integer, minimum: 1, maximum: 52 }

    ScheduledStoredPayload:
      type: object
      additionalProperties: false
      description: 已按 action 校验并持久化的计划参数；broadcast 计划只包含 message。
      properties:
        timeout_seconds: { type: integer, minimum: 1, maximum: 300 }
        health_timeout_seconds: { type: integer, minimum: 1, maximum: 300 }
        maintenance: { type: boolean }
        warning_seconds:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: integer, minimum: 1, maximum: 3600 }
        kind: { type: string, enum: [daily, weekly] }
        retention_daily: { type: integer, minimum: 1, maximum: 365 }
        retention_weekly: { type: integer, minimum: 1, maximum: 52 }
        message:
          {
            type: string,
            minLength: 1,
            maxLength: 200,
            pattern: '^[^;"\\\r\n\x00]+$',
            description: 同时不超过 256 个 UTF-8 字节,
          }

    Player:
      type: object
      properties:
        id: {}
        name: { type: string }
        steam_id: { type: string }
        score: { type: integer }
        ping: { type: integer }
        bot: { type: boolean }
        connected: { type: string }
        connected_at: { type: string, format: date-time }

    PlayerListResponse:
      type: object
      required: [items, status]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Player" }
        status:
          type: string
          enum: [loading, refreshing, ready, failed]
        fresh_at: { type: string, format: date-time }
        refresh_job_id: { type: string, format: uuid }
        message: { type: string }

    PlayerBan:
      type: object
      required: [id, instance_id, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        steam_id: { type: string }
        ip_address: { type: string }
        reason: { type: string, maxLength: 200 }
        created_by: { type: string, format: uuid }
        expires_at:
          {
            type: [string, "null"],
            format: date-time,
            description: null 表示永久封禁,
          }
        created_at: { type: string, format: date-time }

    AddonPackage:
      type: object
      required:
        [
          id,
          instance_id,
          name,
          kind,
          source,
          sha256,
          enabled,
          risk,
          installed_at,
        ]
      properties:
        id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        version: { type: string }
        source: { type: string }
        source_id: { type: string }
        sha256: { type: string }
        path:
          {
            type: string,
            readOnly: true,
            description: 实例目录内的相对目标路径,
          }
        enabled: { type: boolean }
        risk: { type: string }
        installed_by: { type: string, format: uuid }
        installed_at: { type: string, format: date-time }
        file_count: { type: integer, minimum: 0 }
        restart_required: { type: boolean }

    AddonPackageFile:
      type: object
      required: [package_id, instance_id, path, sha256, size, entrypoint, editable]
      properties:
        package_id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        path: { type: string, description: 实例目录内的完整相对位置 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        size: { type: integer, format: int64, minimum: 0 }
        entrypoint: { type: boolean, description: 是否为服务器或 SourceMod 的加载入口 }
        editable: { type: boolean, description: 是否可通过智能插件受管文本编辑接口修改 }

    SmartPluginSelection:
      type: object
      required: [folder_id]
      properties:
        folder_id: { type: string }
        package_id: { type: string, format: uuid, description: 更新同一实例中已有的智能插件 }
        overrides:
          type: object
          additionalProperties: { type: string }
        takeovers:
          type: array
          items: { type: string }
          description: 逐项确认彻底接管的文件 ID；安装成功后旧文件不保留，卸载插件时删除接管文件且不恢复旧内容

    SmartPluginFilePlan:
      type: object
      required: [id, source_path, reason, ambiguous, native, entrypoint, existing, size, sha256]
      properties:
        id: { type: string }
        source_path: { type: string }
        target_path: { type: string }
        suggested_path: { type: string }
        choices: { type: array, items: { type: string } }
        reason: { type: string }
        ambiguous: { type: boolean }
        native: { type: boolean }
        entrypoint: { type: boolean }
        existing: { type: boolean }
        existing_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        managed_package_id: { type: string, format: uuid }
        path_states:
          type: object
          description: 建议路径和各候选路径在识别时的占用状态
          additionalProperties:
            type: object
            required: [existing]
            properties:
              existing: { type: boolean }
              existing_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
              managed_package_id: { type: string, format: uuid }
        size: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }

    SmartPluginFolderPlan:
      type: object
      required: [id, name, files, native_risk, ambiguous_files, existing_files]
      properties:
        id: { type: string }
        name: { type: string }
        source_prefix: { type: string }
        files: { type: array, items: { $ref: "#/components/schemas/SmartPluginFilePlan" } }
        native_risk: { type: boolean }
        ambiguous_files: { type: integer, minimum: 0 }
        existing_files: { type: integer, minimum: 0 }

    SmartPluginPlan:
      type: object
      required: [version, archive_name, archive_sha256, path_encoding, fingerprint, folders, file_count, expanded_bytes, format]
      properties:
        version: { type: integer }
        preview_id: { type: string, format: uuid, description: Agent 本地一次性预检句柄 }
        archive_name: { type: string }
        archive_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        path_encoding: { type: string, enum: [auto, utf8, gbk, big5] }
        fingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
        folders: { type: array, items: { $ref: "#/components/schemas/SmartPluginFolderPlan" } }
        file_count: { type: integer, minimum: 0 }
        expanded_bytes: { type: integer, format: int64, minimum: 0 }
        format: { type: string, enum: [zip, 7z, rar] }

    AddonPackageVersion:
      type: object
      required:
        [id, package_id, instance_id, sha256, size, target_path, created_at]
      properties:
        id: { type: string, format: uuid }
        package_id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        version: { type: string, description: 被保存版本的标签；可能为空 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        size: { type: integer, format: int64, minimum: 0 }
        target_path: { type: string, description: 实例目录内的相对目标路径 }
        created_at: { type: string, format: date-time }

    BackupSummary:
      type: object
      required: [id, name, kind, size, platform, checksum, created_at]
      properties:
        id: { type: string, format: uuid }
        name:
          {
            type: string,
            description: Agent 生成的归档名；自动周副本以 weekly- 开头,
          }
        kind: { type: string, enum: [daily, weekly, checkpoint, manual, plugin_preserve, plugin_compact] }
        size: { type: integer, format: int64 }
        platform: { type: string, example: linux/amd64 }
        checksum: { type: string, pattern: "^[a-f0-9]{64}$" }
        created_at: { type: string, format: date-time }

    BackupUploadStatus:
      type: string
      enum: [uploading, ready, restoring, succeeded, failed, expired]

    BackupUpload:
      type: object
      description: Control 跟踪且正文暂存在目标 Agent 的上传会话；不暴露文件路径或分块正文。
      required:
        [
          id,
          instance_id,
          name,
          platform,
          size,
          sha256,
          received_size,
          status,
          expires_at,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        name: { type: string, maxLength: 180 }
        platform: { type: string, enum: [windows/amd64, linux/amd64] }
        size: { type: integer, format: int64, minimum: 1, maximum: 21474836480 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        received_size: { type: integer, format: int64, minimum: 0 }
        status: { $ref: "#/components/schemas/BackupUploadStatus" }
        last_chunk_job_id: { type: string, format: uuid }
        restore_job_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BackupUploadEnvelope:
      type: object
      required: [upload, idempotent_replay]
      properties:
        upload: { $ref: "#/components/schemas/BackupUpload" }
        idempotent_replay: { type: boolean }

    CreateBackupUploadRequest:
      type: object
      additionalProperties: false
      required: [name, platform, size, sha256]
      properties:
        name:
          type: string
          maxLength: 180
          pattern: '^[^/\\\u0000\r\n]+[.][Zz][Ii][Pp]$'
          description: 去除首尾空白后的安全 basename；Control 另按 UTF-8 字节限制为 180。
        platform: { type: string, enum: [windows/amd64, linux/amd64] }
        size: { type: integer, format: int64, minimum: 1, maximum: 21474836480 }
        sha256: { type: string, pattern: "^[A-Fa-f0-9]{64}$" }

    BackupUploadChunkRequest:
      type: object
      additionalProperties: false
      required: [offset, chunk_sha256, content_base64]
      properties:
        offset: { type: integer, format: int64, minimum: 0 }
        chunk_sha256: { type: string, pattern: "^[A-Fa-f0-9]{64}$" }
        content_base64:
          {
            type: string,
            contentEncoding: base64,
            writeOnly: true,
            description: 解码后必须为 1–1048576 字节；中心数据库仅保存主密钥加密正文并在任务终态清除。,
          }

    BackupUploadJobReference:
      type: object
      required: [job_id, status, idempotent_replay]
      properties:
        job_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/JobStatus" }
        idempotent_replay: { type: boolean }

    BackupUploadChunkStatus:
      type: object
      additionalProperties: false
      required: [job_id, status]
      properties:
        job_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/JobStatus" }

    FileEntry:
      type: object
      required: [name, path, type, size, modified_at]
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string, enum: [file, directory] }
        size: { type: integer, format: int64 }
        modified_at: { type: string, format: date-time }

    FileListResponse:
      type: object
      required: [items, shortcuts, status]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FileEntry" }
        shortcuts:
          type: array
          description: 当前仅可能包含安全确认存在的 admins_simple.ini
          items: { $ref: "#/components/schemas/FileEntry" }
        status: { type: string, enum: [loading, ready] }
        fresh_at: { type: string, format: date-time }
        refresh_job_id: { type: string, format: uuid }

    FileContentResponse:
      type: object
      required: [path, size, sha256, fresh_at]
      properties:
        path: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        fresh_at: { type: string, format: date-time }
        refresh_job_id: { type: string, format: uuid }
        content: { type: string }
        content_base64: { type: string, contentEncoding: base64 }

    FileWriteRequest:
      type: object
      properties:
        content: { type: string, maxLength: 8388608 }
        content_base64: { type: string, contentEncoding: base64 }
        expected_sha256: { type: string, pattern: "^[A-Fa-f0-9]{64}$" }
      description: content 与 content_base64 互斥；空对象创建/覆盖为空文本文件。

    QQFlashFileImportRequest:
      type: object
      required: [share_url]
      additionalProperties: false
      properties:
        share_url:
          type: string
          maxLength: 2048
          description: 可为单个 https://qfile.qq.com/q/... 链接或包含该链接的 QQ 分享文本。

    Schedule:
      type: object
      required:
        [
          id,
          instance_id,
          name,
          cron,
          timezone,
          action,
          enabled,
          misfire_policy,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        name: { type: string }
        cron: { type: string, description: 五字段标准 cron }
        timezone: { type: string }
        action: { $ref: "#/components/schemas/SchedulableInstanceActionType" }
        payload: { $ref: "#/components/schemas/ScheduledStoredPayload" }
        enabled: { type: boolean }
        misfire_policy: { type: string, const: skip }
        last_run_at: { type: [string, "null"], format: date-time }
        next_run_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    JobStatus:
      {
        type: string,
        enum: [queued, dispatched, running, succeeded, failed, canceled],
      }
    Job:
      type: object
      required: [id, node_id, type, status, progress, created_at]
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        scope_instance_id:
          type: string
          format: uuid
          description: 节点共享任务由实例范围权限发起时的授权归属实例；不表示 Agent 在该实例内执行任务
        game_installation_id: { type: string, format: uuid }
        type: { type: string }
        display_type:
          type: string
          enum: [install_mod, install_plugin]
          description: 非敏感的任务展示分类；安装任务即使正文因权限隐藏也可区分模组与插件
        status: { $ref: "#/components/schemas/JobStatus" }
        progress: { type: integer, minimum: 0, maximum: 100 }
        message: { type: string }
        payload: { type: object, additionalProperties: true }
        result:
          type: object
          additionalProperties: true
          readOnly: true
          description: 任务结果。地图导入失败时可包含 failure，结构见 MapImportFailure；仅向具有 jobs.details 权限的调用方返回。
          properties:
            failure: { $ref: "#/components/schemas/MapImportFailure" }
        idempotency_key: { type: string }
        requested_by: { type: string, format: uuid }
        requested_by_display_name:
          type: string
          maxLength: 128
          description: 操作发起人的当前昵称；系统任务或账号已不存在时省略，不返回登录用户名
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    PreparedPackage:
      type: object
      required: [id, name, kind, status, progress]
      properties:
        id: { type: string, format: uuid, description: 准备任务 ID，不是访问凭据 }
        official: { type: boolean, description: 已校验的官方来源标记 }
        version: { type: string, maxLength: 128, description: 准备时固定的官方组件版本 }
        name: { type: string }
        kind: { type: string, enum: [vpk, smx, plugin, native, qq_vpk_bundle, workshop, sourcemod, metamod] }
        status: { type: string, enum: [queued, dispatched, running, succeeded, failed, canceled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        ready: { type: boolean }
        expires_at: { type: string, format: date-time }
        size: { type: integer, format: int64, maximum: 8589934592, description: 单文件最多 512 MiB；qq_vpk_bundle 总大小最多 2 GiB；workshop 快照总大小最多 8 GiB }
        file_count: { type: integer, minimum: 1, maximum: 1000, description: 已就绪 QQ VPK 或 Workshop 文件包的文件数 }
        queue_id: { type: string, format: uuid, description: 正在等待的服务端安装队列 ID }
        consume_job_id: { type: string, format: uuid }
        consume_status: { type: string, enum: [queued, dispatched, running, succeeded, failed, canceled] }
        busy: { type: boolean, description: 消费任务是否仍持有实例写锁（含待投影及待取消确认） }

    JobReference:
      type: object
      required: [job_id]
      properties:
        job_id: { type: string, format: uuid }
        idempotent_replay: { type: boolean, default: false }

    TerminalOutcomeConflict:
      type: object
      description: 不含 Agent 原始结果正文的最终结果冲突元数据。
      required: [job_id, node_id, stored_status, reported_status, reported_fingerprint, reason, occurrences, first_seen_at, last_seen_at]
      properties:
        job_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        stored_status: { type: string, enum: [succeeded, failed, canceled] }
        reported_status: { type: string, enum: [succeeded, failed, canceled] }
        reported_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$", description: 由中心端主密钥生成的结果 HMAC 标识，不是结果正文摘要。 }
        reason: { type: string, maxLength: 64 }
        occurrences: { type: integer, minimum: 1 }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        resolution: { type: string, enum: [keep_control] }
        resolved_at: { type: string, format: date-time }
        resolved_by: { type: string, format: uuid }

    TransferReference:
      type: object
      required: [job_id, status, poll_url]
      properties:
        job_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/JobStatus" }
        poll_url: { type: string }

    LogSearchRequest:
      type: object
      properties:
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        keyword: { type: string, maxLength: 256 }
        limit: { type: integer, minimum: 1, maximum: 1000, default: 200 }

    LogEntry:
      type: object
      required: [stream, message]
      properties:
        at: { type: string, format: date-time }
        stream: { type: string }
        message: { type: string }

    LogSearchResponse:
      type: object
      required: [items, returned, matched, truncated]
      properties:
        items:
          {
            type: array,
            maxItems: 1000,
            items: { $ref: "#/components/schemas/LogEntry" },
          }
        returned: { type: integer }
        matched: { type: integer }
        truncated: { type: boolean }

    LogChunkRequest:
      type: object
      properties:
        segment: { type: integer, minimum: 0, maximum: 19, default: 0 }
        offset: { type: integer, format: int64, minimum: 0, default: 0 }
        length:
          { type: integer, minimum: 1, maximum: 1048576, default: 1048576 }
        expected_sha256: { type: string, pattern: "^[A-Fa-f0-9]{64}$" }

    BackupChunkRequest:
      type: object
      properties:
        offset: { type: integer, format: int64, minimum: 0, default: 0 }
        length:
          { type: integer, minimum: 1, maximum: 1048576, default: 1048576 }
        expected_sha256:
          {
            type: string,
            pattern: "^[A-Fa-f0-9]{64}$",
            description: 兼容字段；服务端以备份登记的完整哈希验证传输源,
          }

    MetricPoint:
      type: object
      required:
        [
          node_id,
          collected_at,
          cpu_percent,
          memory_used,
          memory_total,
          disk_used,
          disk_total,
          network_rx,
          network_tx,
          players,
          sample_count,
        ]
      properties:
        node_id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        collected_at: { type: string, format: date-time }
        cpu_percent: { type: number }
        memory_used: { type: integer, format: int64 }
        memory_total: { type: integer, format: int64 }
        disk_used: { type: integer, format: int64 }
        disk_total: { type: integer, format: int64 }
        network_rx: { type: integer, format: int64 }
        network_tx: { type: integer, format: int64 }
        players: { type: integer }
        sample_count: { type: integer, minimum: 1 }

    MetricsResponse:
      type: object
      required: [items, resolution, from, to]
      properties:
        items:
          {
            type: array,
            maxItems: 10000,
            items: { $ref: "#/components/schemas/MetricPoint" },
          }
        resolution: { type: string, enum: [raw, 1m, 1h] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }

    NotificationView:
      type: object
      required: [id, level, title, message, read, created_at]
      properties:
        id: { type: string, format: uuid }
        level: { type: string }
        title: { type: string }
        message: { type: string }
        read: { type: boolean }
        created_at: { type: string, format: date-time }
        resource: { type: string }
        metadata: { type: object, additionalProperties: true }

    NotificationChannel:
      type: object
      required:
        [id, name, kind, enabled, config, has_secret, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [smtp, webhook] }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true }
        has_secret: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateNotificationChannelRequest:
      type: object
      required: [name, kind, config]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [smtp, webhook] }
        enabled: { type: boolean, default: true }
        config:
          type: object
          additionalProperties: true
          description: Webhook 使用不含凭据、查询或片段的 HTTPS url，投递只连接 DNS 结果中的公网地址；SMTP 使用 host/port/from/to，可选 username。
        secret:
          {
            type: string,
            writeOnly: true,
            description: SMTP 密码或至少 16 字符的 Webhook 签名密钥,
          }

    NotificationDelivery:
      type: object
      required:
        [
          id,
          notification_id,
          channel_id,
          channel_name,
          status,
          attempt_count,
          next_attempt_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        notification_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        channel_name: { type: string }
        status:
          {
            type: string,
            enum: [pending, delivering, succeeded, failed, skipped],
          }
        attempt_count: { type: integer, minimum: 0, maximum: 6 }
        next_attempt_at: { type: string, format: date-time }
        last_error: { type: string }
        response_code: { type: integer }
        delivered_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }

    NotificationDeliveryAttempt:
      type: object
      required: [attempt, succeeded, attempted_at]
      properties:
        attempt: { type: integer, minimum: 1, maximum: 6 }
        succeeded: { type: boolean }
        response_code: { type: integer }
        error: { type: string }
        attempted_at: { type: string, format: date-time }

    AuditEvent:
      type: object
      required: [id, actor_name, action, resource_type, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        actor_name: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        remote_ip: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    Event:
      type: object
      required: [id, type, created_at]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        data: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    PublicServer:
      type: object
      required: [id, name, status, address, players, max_players]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string }
        address: { type: string }
        map: { type: string }
        mode: { type: string }
        players: { type: integer }
        max_players: { type: integer }
        started_at: { type: [string, "null"], format: date-time }

security:
  - sessionCookie: []
  - bearerToken: []
