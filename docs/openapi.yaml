          status,
          attempt_count,
          next_attempt_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        notification_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        channel_name: { type: string }
        status:
          {
            type: string,
            enum: [pending, delivering, succeeded, failed, skipped],
          }
        attempt_count: { type: integer, minimum: 0, maximum: 6 }
        next_attempt_at: { type: string, format: date-time }
        last_error: { type: string }
        response_code: { type: integer }
        delivered_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }

    NotificationDeliveryAttempt:
      type: object
      required: [attempt, succeeded, attempted_at]
      properties:
        attempt: { type: integer, minimum: 1, maximum: 6 }
        succeeded: { type: boolean }
        response_code: { type: integer }
        error: { type: string }
        attempted_at: { type: string, format: date-time }

    AuditEvent:
      type: object
      required: [id, actor_name, action, resource_type, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        actor_name: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        remote_ip: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    Event:
      type: object
      required: [id, type, created_at]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        data: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    PublicServer:
      type: object
      required: [id, name, status, address, players, max_players]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string }
        address: { type: string }
        map: { type: string }
        mode: { type: string }
        players: { type: integer }
        max_players: { type: integer }
        started_at: { type: [string, "null"], format: date-time }

security:
  - sessionCookie: []
  - bearerToken: []
