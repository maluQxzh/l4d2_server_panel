          }
        enabled: { type: boolean }
        risk: { type: string }
        installed_by: { type: string, format: uuid }
        installed_at: { type: string, format: date-time }

    AddonPackageVersion:
      type: object
      required:
        [id, package_id, instance_id, sha256, size, target_path, created_at]
      properties:
        id: { type: string, format: uuid }
        package_id: { type: string, format: uuid }
